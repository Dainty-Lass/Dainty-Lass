# Settings every Trivy scan shares; run them through .github/scripts/trivy.sh, from the repository root.
db:
  no-progress: true
ignorefile: .github/trivy/trivyignore.yaml
scan:
  disable-telemetry: true
  skip-dirs:
    # Test inputs, not code that ships
    - crates/dainty-gateway/tests/parity
    - crates/dainty-content/tests/parity
    - crates/dainty-protocol/tests/cases
    - fuzz/corpus
timeout: 15m
vulnerability:
  # A finding with no fixed version has nothing to upgrade to; cargo-deny's advisories cover the Rust side.
  ignore-unfixed: true

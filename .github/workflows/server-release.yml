# GitHub Actions' copy of .forgejo/workflows/server-release.yml (RR3; MIGRATION_PLAN.md RD8, RH6): the same archives,
# release.json, SHA256SUMS.txt and install check, on GitHub's hosted runners, plus a CycloneDX SBOM of each archive.
#  - DaintyLassServer-<version>-windows-x64.zip and -linux-x64.tar.gz hold dainty-lass-server-<version>/
#    (bin/, plugins/, the Node rollback bundle until RB15, release.json); the Forgejo file says what each holds
#  - SHA256SUMS.txt for the archives
#  - server-sbom, a separate artifact: <archive>.cdx.json for each, from Trivy. Not among the release files, which
#    dainty-host update reads
#
# Until DX5 it is the dry run only, as on Forgejo: Run workflow builds, smoke-tests and keeps the release files as a
# 7-day artifact and publishes nothing. The tag trigger is commented out below, so prepare never sets publish and the
# publish job (provenance and SBOM attestations, then the release) never runs. DX5 turns it on by restoring the
# trigger. Actions are pinned by commit; no cache is used, so every release file comes from this commit alone.
name: Server release

on:
  # DX5: publishing from a tag server-v<version> (x.y.z or x.y.z-prerelease) on the default branch.
  # push:
  #   tags:
  #     - "server-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run's archives (default 0.0.0-dryrun.<run number>)"
        required: false
        type: string

permissions: {}

# Two dry runs of one ref never race for the artifact names; a release tag is never cancelled
concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and release state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version and whether it is published
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STABLE_ALLOWED: ${{ vars.SERVER_RELEASE_STABLE }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # A semantic version without build metadata: x.y.z or x.y.z-prerelease
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          # Only a tag push publishes, and the trigger for one is off until DX5
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$REF" == refs/tags/* ]]; then
            publish=true
            version="${REF_NAME#server-v}"
          else
            publish=false
            version="${INPUT_VERSION:-0.0.0-dryrun.$RUN_NUMBER}"
          fi
          [[ "$version" =~ $semver ]] || fail "$version is not a version (x.y.z or x.y.z-prerelease)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          tag="server-v$version"
          if [ "$publish" = true ]; then
            [ "$REF" = "refs/tags/$tag" ] || fail "a release is published from a tag server-v<version>, not $REF"
            git fetch --quiet origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" ||
              fail "$tag is on ${GITHUB_SHA:0:12}, which is not on $DEFAULT_BRANCH: server releases are made from $DEFAULT_BRANCH only"
            if [ "$prerelease" != true ] && [ "$STABLE_ALLOWED" != true ]; then
              fail "$version is a full release: the Rust servers publish prereleases until the front-door cutover (set SERVER_RELEASE_STABLE=true then)"
            fi
            if out="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .html_url 2>&1)"; then
              fail "$tag is published already ($out): a release is never replaced, raise the version"
            elif ! grep -q 'HTTP 404' <<<"$out"; then
              fail "could not look up the release $tag: $out"
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "servers $version, tag $tag, prerelease $prerelease, publish $publish"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          # 22.04's glibc, not ubuntu-latest's: the Linux archive must run on Debian 12 as Forgejo's bookworm build does
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    defaults:
      run:
        shell: bash
        working-directory: restricted
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Long paths for git
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's temporary folder as bash and GNU tar take it on every runner (tar reads D: as a remote host)
      - name: Work folder
        run: |
          work="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -u "$RUNNER_TEMP")"; fi
          echo "WORK=$work" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      # DAINTY_RELEASE_REPOSITORY stays .cargo/config.toml's until DX5 moves the releases
      - name: Build the release binaries
        run: cargo build --release --locked --target "$TARGET" -p dainty-server -p dainty-server-minimal --features dainty-server/all-modules,dainty-server-minimal/all-modules --bins

      # The libraries the core loads (RD27): the 1.14.7 module from this workspace, the services from the MIT root's
      - name: Build the libraries
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" -p rustic-isles-plugin --lib
          cargo build --release --locked --target "$TARGET" --manifest-path ../Cargo.toml \
            -p dainty-content-plugin -p dainty-chat-plugin -p dainty-gateway-plugin --lib

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Every dependency, dev ones included: gamedata runs Rustic Isles's generators, some of them with tsx.
      # node_modules is installed on each platform, for the packages with a native build (@node-rs/argon2).
      - name: Build the Node rollback bundle (kept for one release until RB15)
        run: |
          set -euo pipefail
          isles=modules/rustic-isles/reference/1.14.7
          for dir in "$isles/ParadoxBackend" "$isles/ParadoxDirector"; do
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done

      - name: Assemble the release folder
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          name="dainty-lass-server-$VERSION"
          out="$WORK/assemble/$name"
          rm -rf "$WORK/assemble" && mkdir -p "$out"
          # The commit's server source, as git has it (no .workspace, nothing git ignores); rustic-isles is in-tree (RD27)
          git -C .. archive --format=tar "$COMMIT:restricted" | tar -x -C "$out"
          mkdir -p "$out/bin"
          for bin in dainty-host dainty-server dainty-server-minimal; do
            cp "target/$TARGET/release/$bin$ext" "$out/bin/"
          done
          # The libraries beside them, under the names host.toml's paths give (RD27)
          mkdir -p "$out/plugins"
          if [ "$RUNNER_OS" = Windows ]; then prefix=""; suffix=".dll"; else prefix="lib"; suffix=".so"; fi
          cp "target/$TARGET/release/${prefix}rustic_isles_plugin$suffix" "$out/plugins/"
          for lib in dainty_content_plugin dainty_chat_plugin dainty_gateway_plugin; do
            cp "../target/$TARGET/release/$prefix$lib$suffix" "$out/plugins/"
          done
          # Kept for one release only as the documented RB13/RU9 rollback artefact (until RB15)
          isles=modules/rustic-isles/reference/1.14.7
          cp -R "$isles/ParadoxBackend/build" "$isles/ParadoxBackend/node_modules" "$out/$isles/ParadoxBackend/"
          cp -R "$isles/ParadoxDirector/dist" "$isles/ParadoxDirector/node_modules" "$out/$isles/ParadoxDirector/"
          # node_modules/.bin holds links to the packages' commands: nothing a host runs needs them
          find "$out" -type d -name .bin -path '*/node_modules/*' -prune -exec rm -rf {} +
          echo "$COMMIT" > "$out/COMMIT"
          # release.json: what update reads, and every file with its SHA-256 (update removes the files an older
          # release had and this one has not, and checks what it installed)
          node - "$out" "$VERSION" "$COMMIT" "$TARGET" "$PLATFORM" "$GITHUB_REPOSITORY" <<'EOF'
          const fs = require("fs"), path = require("path"), crypto = require("crypto");
          const [root, version, commit, target, platform, repository] = process.argv.slice(2);
          const files = [];
          (function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true }).sort((a, b) => (a.name < b.name ? -1 : 1))) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) walk(full);
              else if (e.isFile()) {
                const data = fs.readFileSync(full);
                files.push({ path: path.relative(root, full).split(path.sep).join("/"), sha256: crypto.createHash("sha256").update(data).digest("hex"), size: data.length });
              } else if (e.isSymbolicLink()) throw new Error(`a symbolic link in the release: ${full}`);
            }
          })(root);
          const manifest = { name: "dainty-lass-server", version, commit, target, platform, repository, files };
          fs.writeFileSync(path.join(root, "release.json"), JSON.stringify(manifest, null, 2) + "\n");
          console.log(`release.json: ${files.length} files`);
          EOF

      - name: Smoke test, the binaries start
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          bin="$WORK/assemble/dainty-lass-server-$VERSION/bin"
          for b in dainty-host dainty-server dainty-server-minimal; do "$bin/$b$ext" --help > /dev/null; done
          # Each service the binary runs alone, as the systemd units and the containers run it
          for service in gateway allowlist content backend director; do "$bin/dainty-host$ext" "$service" --help > /dev/null; done
          for db_cmd in migrate verify export-mongo; do "$bin/dainty-host$ext" db "$db_cmd" --help > /dev/null; done
          "$bin/dainty-host$ext" admin schema > /dev/null
          "$bin/dainty-host$ext" --help

      - name: Make the archive
        run: |
          set -euo pipefail
          name="dainty-lass-server-$VERSION"
          mkdir -p "$WORK/release"
          cd "$WORK/assemble"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="DaintyLassServer-$VERSION-$PLATFORM.zip"
            7z a -tzip -mx=9 -bd "$WORK/release/$archive" "$name" > /dev/null
          else
            archive="DaintyLassServer-$VERSION-$PLATFORM.tar.gz"
            tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$WORK/release/$archive" "$name"
          fi
          ls -l "$WORK/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-archive-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Release files and SBOMs
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Only for .github/scripts/trivy.sh and its settings
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-archive-*
          path: release
          merge-multiple: true

      - name: SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release
          expected="$(printf '%s\n' "DaintyLassServer-$VERSION-linux-x64.tar.gz" "DaintyLassServer-$VERSION-windows-x64.zip" | sort)"
          actual="$(ls -A | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::these are not the archives of servers $VERSION"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # What each archive holds, as Trivy reads it: the Cargo.lock in its source and the rollback bundle's packages
      - name: An SBOM of each archive
        run: |
          set -euo pipefail
          mkdir -p sbom
          for archive in release/*.zip release/*.tar.gz; do
            dir="unpacked/$(basename "$archive")"
            mkdir -p "$dir"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$dir" ;;
              *) tar -xzf "$archive" -C "$dir" ;;
            esac
            .github/scripts/trivy.sh fs --scanners vuln --format cyclonedx \
              --output "sbom/$(basename "$archive").cdx.json" "$dir"
          done
          ls -l sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-release
          path: release/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  # The archives install as setup and update install them: from the release files, checked against SHA256SUMS.txt.
  try:
    name: Install (${{ matrix.platform }})
    needs: [prepare, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release
          path: ${{ runner.temp }}/release

      - name: Extract, then check the install with dainty-host update --check
        env:
          DAINTY_SERVER_RELEASE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/host"
          cd "$RUNNER_TEMP/host"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bd "$DAINTY_SERVER_RELEASE/DaintyLassServer-$VERSION-$PLATFORM.zip" > /dev/null
          else
            tar -xzf "$DAINTY_SERVER_RELEASE/DaintyLassServer-$VERSION-$PLATFORM.tar.gz"
          fi
          root="$RUNNER_TEMP/host/dainty-lass-server-$VERSION"
          "$root/bin/dainty-host$ext" update --check | tee check.txt
          grep -q "Up to date" check.txt

  # DX5. Unreachable until then: publish is true only for a tag push, and the tag trigger is off.
  publish:
    name: Publish the release
    needs: [prepare, package, try]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-release
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-sbom
          path: sbom

      - name: Check the release files
        run: |
          set -euo pipefail
          cd release
          expected="$(printf '%s\n' "DaintyLassServer-$VERSION-linux-x64.tar.gz" "DaintyLassServer-$VERSION-windows-x64.zip" SHA256SUMS.txt | sort)"
          [ "$(ls -A | sort)" = "$expected" ] || { echo "::error::these are not the release files of servers $VERSION"; ls -A; exit 1; }
          sha256sum --check --strict SHA256SUMS.txt

      # Signed statements that the archives were built by this workflow from this commit:
      # gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest the build provenance of the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      # gh attestation verify <file> --repo <owner>/<repo> --predicate-type https://cyclonedx.org/bom
      - name: Attest the Linux archive's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/DaintyLassServer-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          sbom-path: sbom/DaintyLassServer-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz.cdx.json

      - name: Attest the Windows archive's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/DaintyLassServer-${{ needs.prepare.outputs.version }}-windows-x64.zip
          sbom-path: sbom/DaintyLassServer-${{ needs.prepare.outputs.version }}-windows-x64.zip.cdx.json

      - name: Create the release
        run: |
          set -euo pipefail
          note=""
          if [ "$PRERELEASE" = true ]; then
            note="This is a test version (a prerelease) of the servers, for the canary."
          fi
          cat > notes.md <<EOF
          DaintyLass servers ${VERSION}: the server in one binary (dainty-server, also as dainty-host, and
          dainty-server-minimal), built from ${COMMIT}. ${note}

          - Windows x64: \`DaintyLassServer-${VERSION}-windows-x64.zip\`
          - Linux x86_64: \`DaintyLassServer-${VERSION}-linux-x64.tar.gz\`

          A server set up from a release moves to this one with \`dainty-host update\`, which downloads it, checks it
          against \`SHA256SUMS.txt\` (and its attestation, when the GitHub CLI is there) and runs setup again. Check a
          download by hand with \`sha256sum --check --ignore-missing SHA256SUMS.txt\` or
          \`gh attestation verify <file> --repo ${GH_REPO}\`. The Windows binaries are not code-signed.

          Free software under the GNU AGPL-3.0; each archive holds the corresponding source. No game files are included.
          EOF
          # Never marked latest: the repository's latest release stays the launcher, which players download
          gh release create "$TAG" release/* --verify-tag --title "Servers ${VERSION}" --notes-file notes.md \
            --prerelease="$PRERELEASE" --latest=false

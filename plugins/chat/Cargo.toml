[package]
name = "chat"
description = "The chat core plugin (DD21, DN10a): XMPP over WebSocket on loopback behind the gateway, rooms, direct messages with offline delivery, history and mutes, from Dauntless Revived's metagame chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# AGPL for good (DD26): ported from Dauntless Revived's XMPP code
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
chrono.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
# By path: the workspace entry names the silentspud registry, which a checkout without its config can't load
module-api = { path = "../../crates/module-api" }
network = { path = "../network" }
protocol.workspace = true
rand.workspace = true
regex.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
store.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
gateway = { path = "../../services/gateway" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-tungstenite.workspace = true
# REFORGED_TEST_POSTGRES_URL, for the Postgres half of the history tests
url.workspace = true

[lints]
workspace = true

[package]
name = "chat-plugin"
description = "The chat core plugin as a library the core loads (RD27)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[lib]
name = "chat_plugin"
crate-type = ["cdylib"]

[dependencies]
chat.workspace = true
module-api.workspace = true
network = { path = "../network", default-features = false }
serde_json.workspace = true
service-kit.workspace = true
service-plugin.workspace = true
store.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
controller = { workspace = true, default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true

# cargo deny for the root workspace. Its crates ship inside restricted/'s AGPL-3.0-only release, so a licence
# here must be one that release can carry.

[graph]
all-features = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The list covers what restricted/ pulls in as well, so some entries match nothing here.
unused-allowed-license = "allow"
allow = [
    # Permissive
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "OpenSSL",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft, file level
    "MPL-2.0",
    # The release licence itself
    "AGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Diesel and rusqlite must link the same bundled SQLite (M17).
    { name = "libsqlite3-sys", deny-multiple-versions = true },
    # TLS is aws-lc-rs (D10).
    { name = "openssl-sys" },
    # libpq; Postgres goes through tokio-postgres instead.
    { name = "pq-sys" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, used at build time by gtk-rs 0.18 under Tauri's Linux GTK3 backend; no vulnerability.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via gtk-rs GTK3 (Tauri 2 on Linux)" },
    # Archived with no vulnerability; reaches us through webrtc-util's nix 0.26.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, via nix 0.26 (webrtc-util)" },
]

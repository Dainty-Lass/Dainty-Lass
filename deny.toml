# The root crates ship in restricted/'s AGPL-3.0-only release, so every licence below must be one it can carry.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained, no vulnerability (chronotope/chrono#1768); moving to jiff or time is its own change.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no vulnerability; until the move to jiff or time" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained with chrono, via console-subscriber" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, build-time only, via gtk-rs 0.18 under Tauri 2's Linux GTK3 backend" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: archived, no vulnerability, via webrtc-util's nix 0.26" },
    # Nothing here opens a less-trusted database with its -wal. diesel 2.3.14 caps libsqlite3-sys < 0.39 (fixed
    # on its main, fcd8d71e); remove this with diesel 2.3.15.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite < 3.54 in libsqlite3-sys 0.38, until diesel allows 0.39" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Shared with restricted/'s release, so some entries match no crate here.
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "libsqlite3-sys", deny-multiple-versions = true }, # one SQLite for Diesel and rusqlite (M17)
    { name = "openssl-sys" },                                    # aws-lc-rs only (D10)
    { name = "pq-sys" },                                         # Postgres via tokio-postgres, no libpq
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Dauntless Reforged Revival server in Docker (docs/hosting-docker.md): the server as one container running
# reforged-server-minimal (docs/app-structure-plan.md), with compose doing the supervision: health check, restarts,
# logs, one clean stop.
#
#   cp .env.example .env               then edit it
#   docker compose build
#   docker compose up -d               the defaults: a private try-out on 127.0.0.1 (server.toml for a real server)
#   docker compose run --rm host invite  the invite link (the log shows it too, with its code hidden)
#
# The server's settings are .workspace/config/server.toml in the workspace volume (docker/server-entrypoint.sh): a
# public server, its name, its address, its ports. The server and the net service share one network namespace, the
# net service's: nothing but the gateway and the game ports is published, and the allowlist's nftables table filters
# the game servers' traffic inside that namespace without touching the host's firewall. Every container mounts the
# volumes at the paths the server uses (/opt/reforged, as the server release).

name: reforged-revival

x-server: &server
  image: ${REFORGED_IMAGE:-reforged-revival}-server:${REFORGED_TAG:-local}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: server
    args:
      REFORGED_COMMIT: ${REFORGED_COMMIT:-}
  network_mode: service:net
  restart: unless-stopped
  volumes:
    - workspace:/opt/reforged/.workspace
    - backend-game-data:/opt/reforged/paradox/backend/game-data
    - director-game-data:/opt/reforged/paradox/director/game-data
    - exports:/opt/reforged/paradox/Items_Analysis
    - captures:/opt/reforged/paradox/DauntlessEndpointDocumentation
    - ${REFORGED_GAME_DIR:-./game}:/game

services:
  # Holds the network namespace and the published ports, so the server restarting never drops them.
  # compose.tailscale.yaml replaces it with Tailscale for a private server.
  net:
    image: ${REFORGED_IMAGE:-reforged-revival}-server:${REFORGED_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
      args:
        REFORGED_COMMIT: ${REFORGED_COMMIT:-}
    command: ["sleep", "infinity"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The public gateway listens on 443 (or server.toml's gateway_port) as an ordinary user
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      # TCP: the gateway, on the port server.toml gives it (443 for a public server; the invites name it)
      - "${REFORGED_GATEWAY_PUBLISH:-443}:${REFORGED_GATEWAY_PORT:-443}/tcp"
      # UDP: the game servers. 8770-8777 is Reforged's range; Refined's is 8780-8787 (server.toml's editions)
      - "${REFORGED_GAME_PUBLISH_ADDRESS:-0.0.0.0}:${REFORGED_GAME_PORTS:-8770-8777}:${REFORGED_GAME_PORTS:-8770-8777}/udp"
    # Healthy at once: the server waits for this (compose.tailscale.yaml's check is the real one)
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s

  # The server: the gateway, the allowlist, the content server, the admin API and the game stack, one process
  # (docker/server-entrypoint.sh). The allowlist's nft has CAP_NET_ADMIN as a file capability; the server itself runs
  # unprivileged on a read-only image (docker/Dockerfile), so no-new-privileges, which would void the file
  # capability, stays off here. It writes only into the volumes.
  server:
    <<: *server
    command: ["reforged-server"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    healthcheck:
      test: ["CMD", "reforged-healthcheck"]
      interval: 5s
      start_period: 60s
      retries: 6
    depends_on:
      net:
        condition: service_healthy

  # The host kit's commands: docker compose run --rm host invite|doctor|gamedata|publish-runtime|preset
  # (docker/host-entrypoint.sh: setup, start, update, multipliers and backup need the host kit's server, not this one)
  host:
    <<: *server
    profiles: [tools]
    restart: "no"
    entrypoint: ["/usr/bin/tini", "--", "reforged-host-docker"]
    command: ["doctor"]
    volumes:
      - workspace:/opt/reforged/.workspace
      - backend-game-data:/opt/reforged/paradox/backend/game-data
      - director-game-data:/opt/reforged/paradox/director/game-data
      - exports:/opt/reforged/paradox/Items_Analysis
      - captures:/opt/reforged/paradox/DauntlessEndpointDocumentation
      - ${REFORGED_GAME_DIR:-./game}:/game
      # Files to bring in: the runtime's DLLs (publish-runtime --from /import/...), game data packs
      - ${REFORGED_IMPORT_DIR:-./import}:/import:ro

  # Every server test suite on the server image (docker/test-in-image.sh): docker compose run --rm test
  # [rust] [backend] [director]. Its own network; the game-data volumes read-only, so the game-data tests check
  # this server's real data. docker/run-tests.sh is the full run, the smoke test included.
  test:
    image: ${REFORGED_IMAGE:-reforged-revival}-test:${REFORGED_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
      args:
        REFORGED_COMMIT: ${REFORGED_COMMIT:-}
    profiles: [test]
    restart: "no"
    # The allowlist's nftables test, in this container's own network namespace
    cap_add: [NET_ADMIN]
    volumes:
      - backend-game-data:/opt/reforged/paradox/backend/game-data:ro
      - director-game-data:/opt/reforged/paradox/director/game-data:ro

volumes:
  workspace:
  backend-game-data:
  director-game-data:
  exports:
  captures:

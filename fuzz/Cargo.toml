# Fuzz targets for untrusted input (MIGRATION_PLAN.md RX3; DR's M33, X9), with cargo-fuzz on nightly, from fuzz:
#   cargo +nightly fuzz run <target> -- -max_total_time=86400
# One target per parser of untrusted input, named after its component (each file in fuzz_targets/ says what
# it feeds); each component row adds its own target and a [[bin]] here, and the integration pass keeps
# this file merged. The components' security pages (docs/security/) list their targets.
# On Windows the AddressSanitizer runtime (clang_rt.asan_dynamic-x86_64.dll) must be on PATH: it is in
# the Visual Studio install, VC/Tools/MSVC/<version>/bin/Hostx64/x64. A workspace of its own: cargo fuzz
# needs nightly and its own build flags.
[package]
name = "dainty-lass-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
admin = { path = "../crates/admin" }
# admin_request: the query parser the admin API runs
async-graphql = { version = "7", default-features = false }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
# chat_stanza: the chat plugin's stanza parser, JIDs and room names (DN10a); chat_federation: node-link chat messages (DN10b)
chat = { path = "../crates/chat" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# content_request, content_runtime_index, content_news: what the content server reads from players and the host
content = { path = "../crates/content" }
# epic_manifest: Epic's download manifests and CDN chunks
epic = { path = "../crates/epic" }
flate2 = "1"
# gateway_policy, gateway_capture, allowlist_input, gateway_modules, gateway_network: the policy, the capture's redaction, the helper's input, the module routes, the region routes (RD27)
gateway = { path = "../crates/gateway" }
# history_bucket: what a restore reads back from the history bucket (DH4)
history-ship = { path = "../crates/history-ship" }
# module_frame: the module framework's frame protocol (DF2); gateway_modules: the stub as a module (DF4a)
module-api = { path = "../crates/module-api" }
http = "1"
# network_directory: the directory's node-link messages (DN4); network_home, network_ticket: the home API's (DN5); network_admin: the admin relay's (DN11); network_logship: peer log shipping (DH7)
network = { path = "../crates/network", features = ["log-ship"] }
# network_link: the certificate names the node link reads
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
protocol = { path = "../crates/protocol" }
remote = { path = "../crates/remote" }
# relay_signal: the ICE signals the relay carries and its relay-only filter (RD27)
rifts-relay = { path = "../crates/rifts-relay" }
# admission_control, admission_ticket: the control frames and join tickets transports exchange (RD27)
rifts-admission = { path = "../crates/rifts-admission" }
# guard_evidence, guard_grants: what a host's transport and inventory transactions hand Rustic Rifts' Guard (RD27)
rifts-guard = { path = "../crates/rifts-guard" }
rifts-seam = { path = "../crates/rifts-seam" }
# rustic_isles_auth_text, rustic_isles_auth_tokens: what Rustic Isles' sign-in area reads from players (RD27)
rustic-isles-auth = { path = "../crates/rustic-isles-auth", features = ["test-support"] }
# rustic_isles_routes, rustic_isles_pipeline_text: the paths and text Rustic Isles' pipeline reads (RD27)
rustic-isles = { path = "../crates/rustic-isles" }
service-kit = { path = "../crates/service-kit" }
# rustic_isles_gamedata_windows, rustic_isles_gamedata_formats: the window rewrite and what the generators read (RD27)
rustic-isles-gamedata = { path = "../crates/rustic-isles-gamedata" }
# rustic_isles_director_{cmdline,matchmaking,tag_query,lines,hunt_import}: what the Director reads from the backend, the
# game servers and a capture (RD27)
rustic-isles-director = { path = "../crates/rustic-isles-director" }
# rustic_isles_store_decode: what Rustic Isles' store reads back from its columns (RD27)
rustic-isles-store = { path = "../crates/rustic-isles-store" }
# rustic_isles_chat_names: the room names, ids, query and bodies Rustic Isles' chat rules read (RD27)
rustic-isles-chat = { path = "../crates/rustic-isles-chat" }
# rustic_isles_replay_input: the capture lines, target answers and key maps the shadow replay harness reads (RD27)
rustic-isles-replay = { path = "../crates/rustic-isles-replay" }
# rustic_isles_characters_data: the character data, loadout writes and stored items Rustic Isles' characters read (RD27)
rustic-isles-characters = { path = "../crates/rustic-isles-characters" }
axum = { version = "0.8", default-features = false }
# transport_frame, transport_files, transport_pipe: what a peer, the launcher's files and the game server hand the
# co-op transport (RD27)
rifts-transport = { path = "../crates/rifts-transport" }
# host_ready_line, host_peer_line, host_transport_config: the transport's lines and the backend's JSON the launcher's
# realm hosting reads (RD27)
rifts-host = { path = "../crates/rifts-host", default-features = false }
serde = "1"
serde_json = "1"
# The SHA-256 several targets check (runtime files, history buckets, log shipping)
sha2 = "0.11"
# launcher_host: the launcher's host.toml reader
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# history_record: change-log records read back during a restore (DH5)
store = { path = "../crates/store" }
url = "2"
# plugin_bytes: the stream reader runs on a runtime
tokio = { version = "1", features = ["rt", "sync", "io-util", "time"] }


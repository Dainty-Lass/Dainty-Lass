# Realms, one library per component (DaintyLass plan, section 2 and DD14). rustic-isles' isles-1-14-7 takes the
# server crates and rifts-seam by version from the silentspud registry, DaintyLass's launcher takes rifts-host, and
# DaintyLass's workspace [patch]es them to modules/rustic-rifts (DD2, spike DF1). The transport's C++ stays at the root
# with its MSBuild files (RF3); it is not a cargo package.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# DD26: rifts is ported from Mystic Paradox's p2p/, realms/ and Guard code, so no crate here is MIT
license = "AGPL-3.0-only"
repository = "https://git.silentspud.com/silentspud/rustic-rifts"
publish = ["silentspud"]

[workspace.dependencies]
rifts-seam = { path = "crates/rifts-seam", version = "0.1.0", registry = "silentspud" }
rifts-admission = { path = "crates/rifts-admission", version = "0.1.0", registry = "silentspud" }
rifts-relay = { path = "crates/rifts-relay", version = "0.1.0", registry = "silentspud" }
rifts-realms = { path = "crates/rifts-realms", version = "0.1.0", registry = "silentspud" }
rifts-guard = { path = "crates/rifts-guard", version = "0.1.0", registry = "silentspud" }
rifts-host = { path = "crates/rifts-host", version = "0.1.0", registry = "silentspud" }

# DaintyLass's crates by git until the silentspud registry has them (spike DF1's fallback); then
# `{ version = "0.1.0", registry = "silentspud" }`. The rev is DaintyLass's plan with DF2 and DF7.
store = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "ca78f56f60b251785192dda283742194be46237b", version = "0.0.0" }
module-api = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "ca78f56f60b251785192dda283742194be46237b", version = "0.1.0" }

# Same versions as DaintyLass's workspace, so one copy of each lands in its tree
diesel = { version = "2.3", default-features = false, features = ["sqlite", "postgres", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite", "postgres"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
thiserror = "2"
# Admission and relay crypto (RF4): RustCrypto, no OpenSSL; sha2, hmac, sha1 and base64 at DaintyLass's versions
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
libloading = "0.7"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Same as DaintyLass (AGENTS.md): a panic in a request handler still drops the request
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Builds ParadoxTransport.dll and its self-test with MSVC v145 and runs `all --relay-local` (RF3). The runner is the
# maintainer's own Windows machine, registered with the label windows-msvc (DX3); see README.md "CI".
# libjuice comes from its v1.7.4 tag archive, checked against a pinned SHA-256 (prepare-dependencies.ps1).
# Actions are pinned by commit.
name: Transport

on:
  push:
    paths-ignore:
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  transport:
    name: Co-op transport
    runs-on: windows-msvc
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      # Its clean (git clean -ffdx) drops a leftover third_party\, so libjuice's hash is checked on every run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          pwsh -NoProfile -File build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed (exit $LASTEXITCODE)" }

      # The test's own watchdog ends a stuck run after 300 s with exit code 3
      - name: Self-test (direct and through a local relay)
        timeout-minutes: 10
        run: |
          .\build\Release\ParadoxTransportTest.exe all --relay-local
          if ($LASTEXITCODE -ne 0) { throw "self-test failed (exit $LASTEXITCODE)" }

      # Stock upload-artifact v4 refuses any host but github.com; Forgejo's fork drops that check
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (v4.3.1, GHES check disabled)
        with:
          name: transport
          path: build/Release/ParadoxTransport.dll
          retention-days: 7
          if-no-files-found: error

# DaintyLass's crates (module-api, protocol, service-kit, store) come from here once published (DD2, spike DF1).
# Read access currently needs a token: CARGO_REGISTRIES_SILENTSPUD_TOKEN="Bearer <token>".
[registries.silentspud]
index = "sparse+https://git.silentspud.com/api/packages/silentspud/cargo/"

# store and module-api come from DaintyLass's repository by git until they are published; cargo's own git
# can't use the ssh agent, the git CLI can.
[net]
git-fetch-with-cli = true

# DaintyLass's SQLite compile options (its .cargo/config.toml), so store's queries mean here what they mean there.
[env]
LIBSQLITE3_FLAGS = "SQLITE_DQS=0 SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_PERCENTILE SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 SQLITE_DEFAULT_CACHE_SIZE=-16000"

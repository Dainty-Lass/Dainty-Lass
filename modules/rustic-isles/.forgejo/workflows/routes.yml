# The 1.14.7 route inventory (RU3a): every Express route the backend and Director register, checked against
# docs/inventory/routes-1.14.7.json. The paths cover the services where they are today and under
# reference/1.14.7/ after RU1. Runner label docker (dainty-lass docs/ci-runners.md). Actions are pinned by commit.
name: Routes

on:
  push:
    paths:
      - scripts/check-route-inventory.mjs
      - docs/inventory/**
      - ParadoxBackend/src/**
      - ParadoxDirector/src/**
      - reference/1.14.7/ParadoxBackend/src/**
      - reference/1.14.7/ParadoxDirector/src/**
      - .forgejo/workflows/routes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes:
    name: Route inventory (1.14.7)
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No dependencies: a static pass over the TypeScript source
      - run: node scripts/check-route-inventory.mjs

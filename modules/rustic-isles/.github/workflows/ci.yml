name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # a manual run; gitleaks then scans the whole history

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reference/1.14.7/ParadoxBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reference/1.14.7/ParadoxBackend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  director:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reference/1.14.7/ParadoxDirector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reference/1.14.7/ParadoxDirector/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  runtime-loader:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/RuntimeLoader
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

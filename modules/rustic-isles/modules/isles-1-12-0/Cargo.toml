[package]
name = "isles-1-12-0"
description = "The game module \"Rustic Isles 1.12\": the version's manifest, hooks, tables and Director config over isles-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "isles_1_12_0"

# The module as an executable the controller starts out of process (DD5)
[[bin]]
name = "isles-1-12-0"
path = "src/main.rs"
test = false
doc = false

[dependencies]
isles-chat.workspace = true
isles-core.workspace = true
isles-director.workspace = true
module-api.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

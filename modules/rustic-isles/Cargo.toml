# One Rust backend and Director for Dauntless 1.14.7 and 1.12.0 (DaintyLass plan, section 2, DD6 and DD8): the
# shared crates under crates/, one thin game module per version under modules/. DaintyLass mounts this repository at
# modules/rustic-isles and builds the module crates by path; its workspace [patch]es DaintyLass's and rustic-rifts'
# crates to its own checkout (DD2, spike DF1). reference/, native/ and tools/ are not cargo packages.
[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# DD26: everything here is ported from Mystic Paradox, so no crate is MIT
license = "AGPL-3.0-only"
repository = "https://git.silentspud.com/silentspud/rustic-isles"
# The modules ship as executables and as path dependencies of DaintyLass, never from a registry
publish = false

[workspace.dependencies]
isles-core = { path = "crates/isles-core" }
isles-chat = { path = "crates/isles-chat" }
isles-director = { path = "crates/isles-director" }

# DaintyLass's crates, as git dependencies on plan at a fixed rev (DF1's fallback) until the silentspud registry
# serves them; then each becomes `version = "0.1.0", registry = "silentspud"` and DaintyLass [patch]es it (DD2).
module-api = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "c777178819f8f4e8bbf0ef7c407f0b75edb9cde9" }
service-kit = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "c777178819f8f4e8bbf0ef7c407f0b75edb9cde9" }
store = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "c777178819f8f4e8bbf0ef7c407f0b75edb9cde9" }
# rustic-rifts' seam always and its server crates behind isles-1-14-7's realms feature (RF2), the same way
rifts-seam = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "b19248c7eb9ffac08ef3e68f883c881f7f926706" }
rifts-admission = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "b19248c7eb9ffac08ef3e68f883c881f7f926706" }
rifts-relay = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "b19248c7eb9ffac08ef3e68f883c881f7f926706" }
rifts-realms = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "b19248c7eb9ffac08ef3e68f883c881f7f926706" }
rifts-guard = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "b19248c7eb9ffac08ef3e68f883c881f7f926706" }

# The versions DaintyLass's workspace asks for, so one copy of each lands in its tree
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "postgres", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite", "postgres"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
percent-encoding = "2"
regex = "1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
# Keys in insertion order, as JavaScript objects keep them (service-kit turns this on in DaintyLass's tree anyway)
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Same as DaintyLass (AGENTS.md): a panic in a request handler still drops the request
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

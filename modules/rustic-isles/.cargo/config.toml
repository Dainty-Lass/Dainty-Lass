# DaintyLass's crates (module-api, service-kit, store) and rustic-rifts' come from here once published (DD2, spike
# DF1). Read access currently needs a token: CARGO_REGISTRIES_SILENTSPUD_TOKEN="Bearer <token>".
[registries.silentspud]
index = "sparse+https://git.silentspud.com/api/packages/silentspud/cargo/"

# Until then they are git dependencies over SSH (DF1's fallback): git's own client takes the SSH key and long paths,
# where cargo's libgit2 failed under a long CARGO_HOME (spike DF1).
[net]
git-fetch-with-cli = true

# As DaintyLass's rust/.cargo/config.toml: the module executables link the C runtime statically, and the bundled
# SQLite gets better-sqlite3's options, so store's queries mean what they mean inside DaintyLass.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LIBSQLITE3_FLAGS = "SQLITE_DQS=0 SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_PERCENTILE SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 SQLITE_DEFAULT_CACHE_SIZE=-16000"

# The MIT workspace (RD27); fuzz/ needs nightly.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://git.silentspud.com/silentspud/dainty-lass"
publish = false

[workspace.dependencies]
# In-tree crates, by directory.
dainty-admin = { path = "crates/dainty-admin" }
dainty-chat = { path = "crates/dainty-chat" }
dainty-content = { path = "crates/dainty-content" }
dainty-controller = { path = "crates/dainty-controller" }
dainty-epic = { path = "crates/dainty-epic" }
dainty-gateway = { path = "crates/dainty-gateway" }
dainty-history-ship = { path = "crates/dainty-history-ship" }
dainty-host = { path = "crates/dainty-host" }
dainty-hostkit = { path = "crates/dainty-hostkit" }
dainty-http = { path = "crates/dainty-http" }
dainty-inject = { path = "crates/dainty-inject" }
dainty-launcher-kit = { path = "crates/dainty-launcher-kit" }
dainty-manager-server = { path = "crates/dainty-manager-server" }
# version and registry let cargo package it for module repositories (DF1).
dainty-module-api = { path = "crates/dainty-module-api", version = "0.1.0", registry = "silentspud" }
dainty-plugin-host = { path = "crates/dainty-plugin-host" }
dainty-protocol = { path = "crates/dainty-protocol" }
dainty-proxy = { path = "crates/dainty-proxy" }
dainty-relay = { path = "crates/dainty-relay" }
dainty-remote = { path = "crates/dainty-remote" }
dainty-service-kit = { path = "crates/dainty-service-kit" }
dainty-service-plugin = { path = "crates/dainty-service-plugin" }
dainty-store = { path = "crates/dainty-store" }
network_plugin = { package = "dainty-network", path = "crates/dainty-network", default-features = false }
# Restricted's launcher still says server-controller.
server-controller = { package = "dainty-controller", path = "crates/dainty-controller" }
rustic-isles = { path = "crates/rustic-isles" }
rustic-isles-1-14-7 = { path = "crates/rustic-isles-1-14-7" }
rustic-isles-1-14-7-plugin = { path = "crates/rustic-isles-1-14-7-plugin" }
rustic-isles-auth = { path = "crates/rustic-isles-auth" }
rustic-isles-characters = { path = "crates/rustic-isles-characters" }
rustic-isles-chat = { path = "crates/rustic-isles-chat" }
rustic-isles-db = { path = "crates/rustic-isles-db" }
rustic-isles-director = { path = "crates/rustic-isles-director" }
rustic-isles-economy = { path = "crates/rustic-isles-economy" }
rustic-isles-gamedata = { path = "crates/rustic-isles-gamedata" }
rustic-isles-launcher-api = { path = "crates/rustic-isles-launcher-api" }
rustic-isles-matchmaking = { path = "crates/rustic-isles-matchmaking" }
rustic-isles-replay = { path = "crates/rustic-isles-replay" }
rustic-isles-store = { path = "crates/rustic-isles-store" }
rustic-rifts-admission = { path = "crates/rustic-rifts-admission" }
rustic-rifts-guard = { path = "crates/rustic-rifts-guard" }
rustic-rifts-host = { path = "crates/rustic-rifts-host" }
rustic-rifts-realms = { path = "crates/rustic-rifts-realms" }
rustic-rifts-relay = { path = "crates/rustic-rifts-relay" }
rustic-rifts-seam = { path = "crates/rustic-rifts-seam" }
rustic-rifts-transport = { path = "crates/rustic-rifts-transport" }

# Third-party, alphabetical. Crypto and TLS are aws-lc-rs, never OpenSSL (D10).
aes = "0.9"
aes-gcm = "0.11"
anstream = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
async-graphql = { version = "7", default-features = false }
aws-lc-rs = "1.18"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio", "ws"] }
base64 = "0.23"
bytes = "1"
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
# Only behind the tokio-console feature (docs/tokio-console.md).
console-subscriber = { version = "0.5", default-features = false }
crossterm = "0.29"
# The launcher's key store on Linux (RL5).
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
# The third-party-backend feature lets the store's Postgres newtype sit in MultiConnection.
diesel = { version = "2.3", default-features = false, features = [
    "i-implement-a-third-party-backend-and-opt-into-breaking-changes",
    "postgres_backend",
    "r2d2",
    "returning_clauses_for_sqlite_3_35",
    "sqlite",
] }
# tokio-postgres underneath, so no libpq.
diesel-async = { version = "0.9", default-features = false, features = ["async-connection-wrapper", "postgres", "r2d2"] }
diesel_migrations = { version = "2.3", features = ["postgres", "sqlite"] }
dotenvy = "0.15"
# Sign-in and the library; dainty-epic downloads manifests and chunks itself (DE1).
egs-api = "=0.14.0"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
hex = "0.4.3"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
# Diesel and rusqlite must share one bundled SQLite, built with .cargo/config.toml's flags (M17).
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
# Epic's newer manifests carry an MD5 beside the SHA-1 (DD22).
md-5 = "0.11"
# MinHook for the MIT game runtime (RT-1); the crate builds MinHook v1.3.4 (BSD-2-Clause) with `cc`.
minhook = "0.9"
open = { version = "5.4", features = ["shellexecute-on-windows"] }
# Public in the admission ticket API.
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8", "std"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
percent-encoding = "2"
rand = "0.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
regex = "1"
# Sans-IO ICE and TURN for the realm transport (spec-rd27-rifts D2).
rtc-ice = { version = "0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
rtc-shared = { version = "0.21.1", default-features = false, features = ["ifaces"] }
rtc-turn = { version = "0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
rusqlite = { version = "0.40", features = ["backup"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sansio = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
sys-locale = "0.3"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri = { version = "2.12", features = ["isolation", "tray-icon"] }
tauri-build = { version = "2.7", features = ["isolation"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
# /metrics' per-module task counts (dainty_service_kit::task).
tokio-metrics = { version = "0.5", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
# Writes settings.toml without losing the host's comments.
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "std", "tracing-log"] }
# The launcher bridge's TypeScript types (L6).
ts-rs = "12"
# A TURN server for tests.
turn = "0.17.2"
twilight-gateway = { version = "0.18", default-features = false, features = ["rustls-webpki-roots"] }
twilight-http = { version = "0.18", default-features = false, features = ["rustls-webpki-roots"] }
twilight-model = "0.18"
twilight-util = { version = "0.18", features = ["builder"] }
ulid = "3"
url = "2"
uuid = { version = "1.28.0", default-features = false }
webpki-roots = "1"
webrtc-util = { version = "0.17", default-features = false, features = ["conn", "vnet"] }
# Windows Firewall over COM; crates choose their own features.
windows = "0.62.2"
# The MIT game runtime's Win32 calls (spec-runtime-r0 section 2); smallest feature set per crate.
windows-sys = { version = "0.61.2", default-features = false }
x509-parser = "0.18.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_must_use = "deny"
# tokio_unstable is set only for tokio-console builds.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
# A handler that panics is caught but its request is lost, so errors are returned (AGENTS.md).
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding lets a server survive a panicking request.
panic = "unwind"

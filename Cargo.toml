# The MIT root workspace of DaintyLass (RD27): the shared crates, the MIT services and the core plugins.
# The AGPL components, launcher and game modules live in restricted/ (an independent workspace).
[workspace]
resolver = "3"
members = ["crates/*"]
# Separate workspaces: the fuzz targets (cargo fuzz, nightly) and the AGPL subtree (restricted/)
exclude = ["fuzz", "restricted"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://git.silentspud.com/silentspud/dainty-lass"
publish = false

[workspace.dependencies]
controller = { path = "crates/controller" }
server-controller = { path = "crates/controller", package = "controller" }
hostkit = { path = "crates/hostkit" }
launcher-kit = { path = "crates/launcher-kit" }
# Published for the module repositories: registry = "silentspud" keeps cargo package from writing a crates.io
# dependency (spike DF1)
module-api = { path = "crates/module-api", version = "0.1.0", registry = "silentspud" }
plugin-host = { path = "crates/plugin-host" }
protocol = { path = "crates/protocol" }
remote = { path = "crates/remote" }
store = { path = "crates/store" }
history-ship = { path = "crates/history-ship" }
service-kit = { path = "crates/service-kit" }
service-plugin = { path = "crates/service-plugin" }
proxy = { path = "crates/proxy" }
admin = { path = "crates/admin" }
gateway = { path = "crates/gateway" }
content = { path = "crates/content" }
epic = { path = "crates/epic" }
chat = { path = "crates/chat" }
rifts-seam = { path = "crates/rifts-seam" }
rifts-relay = { path = "crates/rifts-relay" }
rifts-admission = { path = "crates/rifts-admission" }
rifts-guard = { path = "crates/rifts-guard" }
rifts-realms = { path = "crates/rifts-realms" }
rifts-transport = { path = "crates/rifts-transport" }
rifts-host = { path = "crates/rifts-host" }
# The Rustic Isles sign-in area, clean-room MIT (RD27, spec-rustic-isles-auth)
rustic-isles-auth = { path = "crates/rustic-isles-auth" }
# The Rustic Isles module skeleton, clean-room MIT (RD27, spec-rustic-isles-core)
rustic-isles = { path = "crates/rustic-isles" }
# The Rustic Isles Director, clean-room MIT (RD27, spec-rustic-isles-director)
rustic-isles-director = { path = "crates/rustic-isles-director" }
# The Rustic Isles game-data area and generators, clean-room MIT (RD27, spec-rustic-isles-gamedata)
rustic-isles-gamedata = { path = "crates/rustic-isles-gamedata" }
# The Rustic Isles database layer, clean-room MIT (RD27, spec-rustic-isles-store)
rustic-isles-store = { path = "crates/rustic-isles-store" }
# The Rustic Isles chat rules and chat area routes, clean-room MIT (RD27, spec-rustic-isles-chat)
rustic-isles-chat = { path = "crates/rustic-isles-chat" }
# The Rustic Isles shadow replay harness, clean-room MIT (RD27, spec-rustic-isles-replay)
rustic-isles-replay = { path = "crates/rustic-isles-replay" }
# The Rustic Isles characters and loadouts area, clean-room MIT (RD27, spec-rustic-isles-characters)
rustic-isles-characters = { path = "crates/rustic-isles-characters" }
# The Rustic Isles economy: inventory, progression, bounties and the stores, clean-room MIT (RD27,
# spec-rustic-isles-economy-*)
rustic-isles-economy = { path = "crates/rustic-isles-economy" }
# The Rustic Isles Reforged API: probes, metrics, the launcher API, updates, logs, notices, operations, activity,
# Launcher Guard and the admin API, clean-room MIT (RD27, spec-rustic-isles-reforged-*)
rustic-isles-reforged = { path = "crates/rustic-isles-reforged" }
# The Rustic Isles matchmaking and parties, clean-room MIT (RD27, spec-rustic-isles-matchmaking)
rustic-isles-matchmaking = { path = "crates/rustic-isles-matchmaking" }
# The Rustic Isles database tool: migrate, verify and export-mongo, clean-room MIT (RD27, spec-rustic-isles-db)
rustic-isles-db = { path = "crates/rustic-isles-db" }
# Rustic Isles for Dauntless 1.14.7, the version crate and its plugin, clean-room MIT (RD27, spec-rustic-isles-1-14-7)
rustic-isles-1-14-7 = { path = "crates/rustic-isles-1-14-7" }
rustic-isles-1-14-7-plugin = { path = "crates/rustic-isles-1-14-7-plugin" }
# The transport's ICE agent and TURN client, sans-IO (spec-rd27-rifts D2)
rtc-ice = { version = "0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
rtc-turn = { version = "0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
# The stack's own: its addresses and interface list, and the trait the agent and client are driven through
rtc-shared = { version = "0.21.1", default-features = false, features = ["ifaces"] }
sansio = "1.0.1"
# A TURN server for the transport's tests (dev only)
turn = "0.17.2"
webrtc-util = { version = "0.17", default-features = false, features = ["conn", "vnet"] }
hmac = "0.13"

crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# RSA token keys and CSPRNG (D10: aws-lc-rs, already in the tree through rustls and rcgen)
# Console colors, with the legacy Windows console (already in the tree through clap)
anstream = "1"
aws-lc-rs = "1.18"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "form", "ws"] }
aes-gcm = "0.11"
# Launcher passwords: reads the Argon2id PHC hashes accounts already have (rustic-isles-auth)
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# ES256 admission tickets (rifts-admission). Its types are in that crate's public API, so dainty-restricted resolves
# the same line
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8", "std"] }
# The admin API's GraphQL schema (crates/admin); no web framework integration, no playground
async-graphql = { version = "7", default-features = false }
base64 = "0.23"
bytes = "1"

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "postgres_backend", "r2d2", "returning_clauses_for_sqlite_3_35", "i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
# Postgres without libpq: tokio-postgres behind Diesel's sync API; the third-party-backend feature lets
# store's `PgConnection` newtype join `MultiConnection` (crates/store/src/connection.rs)
diesel-async = { version = "0.9", default-features = false, features = ["postgres", "async-connection-wrapper", "r2d2"] }
diesel_migrations = { version = "2.3", features = ["sqlite", "postgres"] }
dotenvy = "0.15"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
hex = "0.4.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# HTTPS for the services' outgoing requests (D10: aws-lc-rs)
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-tokio", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# The roots rustic-isles-auth's SMTP client verifies against (hyper-rustls already pulls this line)
webpki-roots = "1"
# Bundled: one SQLite, built with the options in .cargo/config.toml, shared by Diesel and rusqlite (M17).
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
percent-encoding = "2"
regex = "1"
# Process CPU and memory for /metrics (service-kit's registry, controller's collector)
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
rusqlite = { version = "0.40", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
# Epic's manifests and chunks are pinned and checked by SHA-1 (crates/epic, DD22)
sha1 = "0.11"
# Epic sign-in and library only: the manifests and chunks are read by crates/epic itself (spike DE1)
egs-api = "=0.14.0"
thiserror = "2"
# host.toml: read, and written back keeping the host's own comments and layout
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tokio ={ version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
tracing = "0.1"
tracing-log = "0.2"
# TypeScript types from Rust types (the launcher bridge, L6)
ts-rs = "12"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "std", "tracing-log"] }
toml = "0.9"
rand = "0.10"
tempfile = "3"
# Network-wide ids, tagged with the owning node (DD18, crates/module-api)
ulid = "3"
# The chat plugin's (crates/chat): constant-time comparisons, and the WebSocket clients
# of its parity tests (the version axum's ws uses)
subtle = "2"
# The gateway (RD27): its certificate, the TLS listener and the certificate checks, as the network plugin pins them
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
x509-parser = "0.18.1"
# rcgen's certificate dates
time = "0.3"
# Windows Firewall through COM for the allowlist helper (features per crate)
windows = "0.62.2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# Every public item carries rustdoc; tests are exempt (rustc skips the harness).
missing_docs = "warn"

[workspace.lints.clippy]
# A panic in a request handler is caught (CatchPanicLayer), but it still drops the request.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
# An allow says why, in its reason.
allow_attributes_without_reason = "warn"

# Section 2: servers catch a panicking request instead of dying, so panics unwind.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"

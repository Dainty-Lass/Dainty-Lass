# Static CRT: players and hosts need no Visual C++ redistributable (M38).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Where update and setup look for releases unless the environment says otherwise.
DAINTY_RELEASE_REPOSITORY = "Dainty-Lass/Dainty-Lass"
# aws-lc-sys's prebuilt objects; no NASM needed on Windows (D10).
AWS_LC_SYS_PREBUILT_NASM = "1"
# Bundled SQLite behaving as the Node services' better-sqlite3 did: double quotes are identifiers only, LIKE
# ignores BLOBs, math and percentile functions, WAL with synchronous=NORMAL, 16 MB default cache.
LIBSQLITE3_FLAGS = "SQLITE_DQS=0 SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_PERCENTILE SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 SQLITE_DEFAULT_CACHE_SIZE=-16000"

# Forgejo's Cargo index, for dainty-module-api's registry key (DD2, DF1).
[registries.silentspud]
index = "sparse+https://git.silentspud.com/api/packages/silentspud/cargo/"

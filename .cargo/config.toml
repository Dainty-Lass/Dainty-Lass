[env]
# SQLite built to match the Node services' better-sqlite3 where it changes results: "x" is always an
# identifier, LIKE skips BLOBs, math and percentile functions, WAL at synchronous=NORMAL, a 16 MB page cache.
LIBSQLITE3_FLAGS = "SQLITE_DQS=0 SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_PERCENTILE SQLITE_DEFAULT_WAL_SYNCHRONOUS=1 SQLITE_DEFAULT_CACHE_SIZE=-16000"
# Prebuilt assembly for aws-lc-sys, so a Windows build needs no NASM (D10).
AWS_LC_SYS_PREBUILT_NASM = "1"
# Default release source for update and setup; a variable of the same name in the environment wins.
DAINTY_RELEASE_REPOSITORY = "SilentSpud/DaintyLass"

# No Visual C++ redistributable on players' or hosts' PCs (M38).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Forgejo's index, named so `registry = "silentspud"` on dainty-module-api resolves (DD2, DF1).
[registries.silentspud]
index = "sparse+https://git.silentspud.com/api/packages/silentspud/cargo/"

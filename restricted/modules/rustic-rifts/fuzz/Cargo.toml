# Fuzz targets for untrusted input (DaintyLass plan DX2, RX3), with cargo-fuzz on nightly, from fuzz/:
#   cargo +nightly fuzz run <target> -- -max_total_time=86400
# One target per parser of untrusted input, named after its component (each file in fuzz_targets/ says what it
# feeds); each row adds its own target and a [[bin]] here, and the integration pass keeps this file merged. The
# components' security pages (docs/security/) list their targets. A workspace of its own: cargo fuzz needs nightly
# and its own build flags.
[package]
name = "rustic-rifts-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# admission_ticket, admission_control: MPT2 tickets and MPC1 control frames (RF4)
rifts-admission = { path = "../crates/rifts-admission" }
# guard_evidence, guard_grants: Hunt Guard evidence batches and completions, host inventory grants (RF6)
rifts-guard = { path = "../crates/rifts-guard" }
# relay_signal: ICE signal bodies and the relay-only filter (RF4)
rifts-relay = { path = "../crates/rifts-relay" }
rifts-seam = { path = "../crates/rifts-seam" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]
members = ["."]

[[bin]]
name = "guard_evidence"
path = "fuzz_targets/guard_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guard_grants"
path = "fuzz_targets/guard_grants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission_control"
path = "fuzz_targets/admission_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admission_ticket"
path = "fuzz_targets/admission_ticket.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_signal"
path = "fuzz_targets/relay_signal.rs"
test = false
doc = false
bench = false

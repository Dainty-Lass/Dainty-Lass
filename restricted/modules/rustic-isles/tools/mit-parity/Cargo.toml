# Rustic Isles' recorded Node goldens replayed against the clean-room MIT module (RD27). A workspace of its own:
# the MIT module brings dainty-lass's rifts-* crates, whose names restricted's rustic-rifts members also use, and one
# lockfile can't hold both. So nothing here links isles-core; what this takes from restricted's harnesses is copied.
[workspace]
resolver = "3"

[package]
name = "isles-mit-parity"
description = "Rustic Isles' recorded goldens replayed against the composed MIT module, as a parity report"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[dev-dependencies]
# The composed MIT module and the MIT crates it builds on, from dainty-lass's root by relative path
rustic-isles-1-14-7 = { path = "../../../../../crates/rustic-isles-1-14-7", features = ["test-support"] }
rustic-isles = { path = "../../../../../crates/rustic-isles", features = ["test-support"] }
rustic-isles-auth = { path = "../../../../../crates/rustic-isles-auth", features = ["test-support"] }
module-api = { path = "../../../../../crates/module-api" }
service-kit = { path = "../../../../../crates/service-kit" }
aws-lc-rs = "1.18"
base64 = "0.23"
regex = "1"
rusqlite = "0.40"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
rustic-isles-store = { path = "../../../../../crates/rustic-isles-store" }

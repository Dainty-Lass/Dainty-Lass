# DaintyLass's legacy plugin: imports old installs and upgrades them to DaintyLass (Dauntless 1.14.7 on rustic-isles).
# crates/legacy-import holds the importers, crates/legacy the Plugin module DaintyLass runs out of process (DD5), so
# this AGPL code never links into DaintyLass's MIT core. fuzz/ is a workspace of its own.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# DD26: the importers are ported from Dauntless Revived, and the target schema is rustic-isles'
license = "AGPL-3.0-only"
repository = "https://git.silentspud.com/silentspud/dainty-legacy"
publish = false

[workspace.dependencies]
legacy-import = { path = "crates/legacy-import" }

# DaintyLass's crates, as git dependencies on plan at a fixed rev (DF1's fallback) until the silentspud registry
# serves them; then each becomes `version = "0.1.0", registry = "silentspud"` (DD2). One rev for both, so they share
# one copy of module-api.
module-api = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "fb46a4a322f83a9e6f0bd0540bb825cedd83c319" }
store = { git = "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git", rev = "fb46a4a322f83a9e6f0bd0540bb825cedd83c319" }

# The versions DaintyLass's workspace asks for, so one copy of each lands in its tree
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "postgres", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Same as DaintyLass (AGENTS.md): a panic in a request handler still drops the request
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

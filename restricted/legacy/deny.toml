# cargo-deny, on Dainty Lass's rules (rust/deny.toml there): licences that can ship in an AGPL-3.0-only release,
# known advisories, and only crates.io, the silentspud registry and, until it serves them, Dainty Lass's repository.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained, no vulnerability (chronotope/chrono#1768); moving to jiff or time is its own change.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no vulnerability; until the move to jiff or time" },
    # SQLite < 3.54 with a crafted sibling -wal. Diesel 2.3.14 caps libsqlite3-sys < 0.39 (the fix is on its
    # unreleased main, fcd8d71e); nothing here opens a less-trusted database with its -wal. Drop it on diesel 2.3.15.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via libsqlite3-sys 0.38 until diesel allows 0.39" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "PostgreSQL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # rustls with aws-lc-rs everywhere, as in Dainty Lass (D10); no OpenSSL.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://git.silentspud.com/api/packages/silentspud/cargo/",
]

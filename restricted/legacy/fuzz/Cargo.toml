# Fuzz targets for what an import reads from an old install, with cargo-fuzz on nightly, from fuzz/:
#   cargo +nightly fuzz run <target> -- -max_total_time=3600
# database_readers: arbitrary bytes as a 1.4.4 server database, an offline database and a .drsave container
# (`revived::source::prepare`, `revived::drsave::read_save`). host_json: arbitrary text as a Node kit's host.json
# (`reforged::hostjson::convert`). CI runs each for a short time on every push. A workspace of its own: cargo fuzz
# needs nightly and its own build flags. On Windows the AddressSanitizer runtime must be on PATH (VC/Tools/MSVC/
# <version>/bin/Hostx64/x64 in the Visual Studio install).
[package]
name = "dainty-legacy-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
dainty-legacy-import = { path = "../crates/dainty-legacy-import" }
libfuzzer-sys = "0.4"
tempfile = "3"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[[bin]]
name = "database_readers"
path = "fuzz_targets/database_readers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_json"
path = "fuzz_targets/host_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

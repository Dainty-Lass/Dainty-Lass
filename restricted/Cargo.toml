# The AGPL half of Dainty Lass (RD27): the AGPL services, the launcher, the game modules and the server binaries,
# in one workspace. Dainty Lass's MIT crates come from dainty-lass at one rev (below); bump it in one
# place, for every crate at once, or the game modules would build against a second copy of module-api.
[workspace]
resolver = "3"
members = [
    # Each package in crates/<name> (RD27): the host shell, the server executables, and the libraries of dainty-lass's
    # content, gateway and chat, built here where they ship
    "crates/*",
    "launcher/src-tauri",
    # The game module and its crates (DD6, DD8)
    "modules/rustic-isles/crates/*",
    # Mystic Paradox's answers replayed against dainty-lass's MIT rifts crates (spec-rd27-rifts 4.3)
    "modules/rustic-rifts/oracle",
]
# Workspaces of their own: the fuzz targets (nightly), the 1.4.4 importer (an external plugin, host.toml pins it), the
# runtime loader (Apache-2.0) and the launcher's host fixture
exclude = ["fuzz", "legacy", "modules/rustic-isles/tools", "launcher/src-tauri/fixtures/host"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://git.silentspud.com/silentspud/dainty-lass"
publish = false

[workspace.dependencies]
dainty-controller = { path = "../crates/dainty-controller" }
server-controller = { path = "../crates/dainty-controller", package = "dainty-controller" }
dainty-hostkit = { path = "../crates/dainty-hostkit" }
dainty-launcher-kit = { path = "../crates/dainty-launcher-kit" }
dainty-module-api = { path = "../crates/dainty-module-api" }
# The network core plugin (DD16-DD18), by its own name (chat) and the one the gateway and host use
dainty-network = { path = "../crates/dainty-network" }
network_plugin = { path = "../crates/dainty-network", package = "dainty-network", default-features = false }
dainty-plugin-host = { path = "../crates/dainty-plugin-host" }
# The protocol a service built as a library speaks (RD27)
dainty-service-plugin = { path = "../crates/dainty-service-plugin" }
dainty-protocol = { path = "../crates/dainty-protocol" }
dainty-remote = { path = "../crates/dainty-remote" }
dainty-store = { path = "../crates/dainty-store" }
dainty-history-ship = { path = "../crates/dainty-history-ship" }
dainty-service-kit = { path = "../crates/dainty-service-kit" }
dainty-proxy = { path = "../crates/dainty-proxy" }
dainty-admin = { path = "../crates/dainty-admin" }
dainty-chat = { path = "../crates/dainty-chat" }
dainty-content = { path = "../crates/dainty-content" }
dainty-epic = { path = "../crates/dainty-epic" }
# The game modules compiled into the server (DF5), a Cargo feature of the host and the bins: dainty-lass's clean-room
# 1.14.7 module (RD27) with its db tool, replay, generators and hunt-table import; also isles-mit-parity's replay
rustic-isles = { path = "../crates/rustic-isles" }
rustic-isles-1-14-7 = { path = "../crates/rustic-isles-1-14-7", default-features = false }
rustic-isles-auth = { path = "../crates/rustic-isles-auth" }
rustic-isles-db = { path = "../crates/rustic-isles-db" }
rustic-isles-director = { path = "../crates/rustic-isles-director" }
rustic-isles-gamedata = { path = "../crates/rustic-isles-gamedata" }
rustic-isles-replay = { path = "../crates/rustic-isles-replay" }
rustic-isles-store = { path = "../crates/rustic-isles-store" }
# Realms (DD14, RF2): the seam always, admission and relay for the oracle, rifts-host behind the
# launcher's
rustic-rifts-seam = { path = "../crates/rustic-rifts-seam" }
rustic-rifts-admission = { path = "../crates/rustic-rifts-admission" }
rustic-rifts-relay = { path = "../crates/rustic-rifts-relay" }
rustic-rifts-host = { path = "../crates/rustic-rifts-host" }
dainty-gateway = { path = "../crates/dainty-gateway" }
dainty-host = { path = "crates/dainty-host" }
dainty-launcher = { path = "launcher/src-tauri" }

crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# RSA token keys and CSPRNG (D10: aws-lc-rs, already in the tree through rustls and rcgen)
aws-lc-rs = "1.18"
aes-gcm = "0.11"
# The admin API's GraphQL schema (crates/dainty-admin); no web framework integration, no playground
async-graphql = { version = "7", default-features = false }
base64 = "0.23"

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "postgres_backend", "r2d2", "returning_clauses_for_sqlite_3_35", "32-column-tables"] }
diesel_migrations = { version = "2.3", features = ["sqlite", "postgres"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service", "client-legacy", "http1"] }
# HTTPS for the services' outgoing requests (D10: aws-lc-rs)
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-tokio", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# Bundled: one SQLite, built with the options in .cargo/config.toml, shared by Diesel and rusqlite (M17).
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
percent-encoding = "2"
regex = "1"
# Process CPU and memory for /metrics (service-kit's registry, controller's collector)
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
rusqlite = { version = "0.40", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
# Keys in insertion order, as JavaScript objects keep them (rustic-isles' JSON matches Node's)
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11"
# Epic's manifests and chunks are pinned and checked by SHA-1 (crates/dainty-epic, DD22)
sha1 = "0.11"
# Epic sign-in and library only: the manifests and chunks are read by crates/dainty-epic itself (spike DE1)
egs-api = "=0.14.0"
thiserror = "2"
# host.toml: read, and written back keeping the host's own comments and layout
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tokio ={ version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
tracing = "0.1"
tracing-log = "0.2"
# TypeScript types from Rust types (the launcher bridge, L6)
ts-rs = "12"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "std", "tracing-log"] }
toml = "0.9"
rand = "0.10"
tempfile = "3"
# Network-wide ids, tagged with the owning node (DD18, crates/dainty-module-api)
ulid = "3"
# WebSocket clients
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

# rustic-isles' and rustic-rifts' own (RU5 auth, RU6 Director, RF4 admission and relay)
getrandom = "0.4"
libc = "0.2.191"
libloading = "0.7"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# A panic in a request handler is caught (CatchPanicLayer), but it still drops the request.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Section 2: servers catch a panicking request instead of dying, so panics unwind.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"

# Argon2 is memory-hard: an unoptimised build takes seconds per password, which the auth tests do dozens of times
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

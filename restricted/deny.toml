# cargo-deny: licences that can ship in an AGPL-3.0-only release, known advisories, and duplicate
# copies of crates that must exist once per binary (MIGRATION_PLAN.md X6).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Tauri 2 on Linux draws with GTK3 through gtk-rs 0.18, which is no longer maintained; its macros
    # use proc-macro-error. Build-time only, no known vulnerability; goes when Tauri moves off GTK3.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via gtk-rs GTK3 (Tauri 2 on Linux)" },
    # SQLite < 3.54 with a crafted sibling -wal. Diesel 2.3.14 caps libsqlite3-sys < 0.39 (the fix is on its
    # unreleased main, fcd8d71e); nothing here opens a less-trusted database with its -wal. Drop it on diesel 2.3.15.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via libsqlite3-sys 0.38 until diesel allows 0.39" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The list is for the whole port; crates arrive with later rows.
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # One bundled SQLite per binary: Diesel and rusqlite must share it (M17).
    { name = "libsqlite3-sys", deny-multiple-versions = true },
    # rustls with aws-lc-rs everywhere (D10); no OpenSSL.
    { name = "openssl-sys" },
    # Postgres through tokio-postgres, not libpq: `diesel/postgres` would bring the C build back.
    { name = "pq-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

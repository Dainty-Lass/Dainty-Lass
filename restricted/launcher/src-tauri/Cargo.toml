[package]
name = "dainty-launcher"
# Test-only (spec-tauri-shell §12.1): the apps are the root's MIT dainty-launcher-app
description = "The oracle tests for the MIT launcher kit and the manager's embedded server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# dainty-launcher-kit's stand-in for `dainty-host`, for the Host page's tests (spec §2.10)
[[bin]]
name = "fake-host-kit"
path = "../../../crates/dainty-launcher-kit/tests/fixtures/host/fake_host_kit.rs"
test = false
doc = false
bench = false

[dependencies]
dainty-launcher-kit = { workspace = true, default-features = false }
# The manager's embedded server (RD26): MIT since lane C (spec-tauri-shell §11.1)
dainty-manager-server = { path = "../../../crates/dainty-manager-server", optional = true }
# fake-host-kit's
serde_json.workspace = true

[dev-dependencies]
# The oracle for dainty-manager-server (tests/manager_server.rs)
dainty-admin.workspace = true
dainty-host.workspace = true
dainty-service-kit.workspace = true
server-controller.workspace = true
dainty-module-api.workspace = true
rustic-rifts-host.workspace = true
rustic-rifts-seam.workspace = true
percent-encoding.workspace = true
tracing-log.workspace = true
ts-rs.workspace = true
dainty-proxy.workspace = true
aes = "0.9"
aes-gcm.workspace = true
cbc = { version = "0.2", features = ["alloc"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
dainty-launcher-kit = { workspace = true, default-features = false, features = ["ts"] }
dainty-protocol = { workspace = true, features = ["ts", "test-data"] }
base64.workspace = true
bytes = "1"
chrono.workspace = true
dainty-epic.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1", "server"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1"
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util", "sync", "macros", "rt", "rt-multi-thread", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = "0.1"
url.workspace = true

[features]
# The Host tools page (RA12); `--no-default-features` tests the player-only launcher
default = ["host"]
host = ["dainty-launcher-kit/host"]
server-gui = [
    "host",
    "dainty-launcher-kit/server-gui",
    "dep:dainty-manager-server",
    "isles-1-14-7",
    "dainty-manager-server?/realms",
]
# The game modules the server GUI links in, as the server binaries' (DF5)
stub-module = ["dainty-manager-server?/stub-module"]
isles-1-14-7 = ["dainty-manager-server?/isles-1-14-7"]
realms = ["dainty-launcher-kit/realms", "dainty-manager-server?/realms"]
all-modules = ["isles-1-14-7", "realms"]

[lints]
workspace = true

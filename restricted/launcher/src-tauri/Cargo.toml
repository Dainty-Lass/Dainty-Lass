[package]
name = "launcher"
description = "DaintyLass Launcher's AGPL half (RD27 spec §4.4): today's icons, the manager build and DR's recorded tables"
# The launcher's own version, not the workspace's: kept equal to ../package.json's (a test checks it).
version = "2.0.0-beta"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "launcher"

# One binary, as `tauri build` packages one and names it from the config's mainBinaryName (RD26):
#   tauri build                                    dainty-launcher: launcher-app with today's icons
#   tauri build --config src-tauri/tauri.server-gui.conf.json --features server-gui
#                                                  dainty-manager: the server manager with the server inside
[[bin]]
name = "dainty-launcher"
path = "src/main.rs"

[build-dependencies]
# The executable's Windows resources (icon, manifest) from tauri.conf.json; the app's context is launcher-app's
tauri-build = { version = "2.7", features = ["isolation"] }

[dependencies]
launcher-app = { path = "../../../crates/launcher-app", default-features = false }
launcher-kit = { workspace = true, default-features = false }
tauri = { version = "2.12", features = ["isolation", "tray-icon"] }
# The manager's embedded server (RD26) and its in-process host kit
admin = { workspace = true, optional = true }
host = { workspace = true, optional = true }
module-api = { workspace = true, optional = true }
server-controller = { workspace = true, optional = true }
service-kit = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "rt"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["registry"] }

[dev-dependencies]
launcher-kit = { workspace = true, features = ["ts"] }
protocol = { workspace = true, features = ["ts", "test-data"] }
base64.workspace = true
bytes = "1"
chrono.workspace = true
epic.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1", "server"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1"
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util", "sync", "macros", "rt", "rt-multi-thread", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = "0.1"
url.workspace = true

[features]
# The Host tools page (RA12). Without it, a player-only launcher (`--no-default-features`)
default = ["host"]
host = ["launcher-app/host", "launcher-kit/host"]
server-gui = [
    "host",
    "launcher-app/server-gui",
    "launcher-kit/server-gui",
    "dep:admin",
    "dep:chrono",
    "dep:host",
    "dep:module-api",
    "dep:server-controller",
    "dep:service-kit",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "isles-1-14-7",
    "host?/realms",
]
# The game modules the server GUI links in, as the server binaries' (DF5)
stub-module = ["host?/stub-module"]
isles-1-14-7 = ["host?/isles-1-14-7"]
realms = ["launcher-app/realms", "launcher-kit/realms", "host?/realms"]
all-modules = ["isles-1-14-7", "realms"]
# Set by `tauri build`: serve the built page from the binary instead of the Vite dev server
custom-protocol = ["launcher-app/custom-protocol"]

[lints]
workspace = true

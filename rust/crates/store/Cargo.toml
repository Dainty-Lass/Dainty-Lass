[package]
name = "store"
description = "SQLite and Postgres through Diesel for every service: pools, closures on the blocking pool, migrations, Drizzle adoption, the change log (MIGRATION_PLAN.md D10, D11; DD15, DD23)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
diesel.workspace = true
diesel_migrations.workspace = true
libsqlite3-sys.workspace = true
# Only to pick libpq's build: bundled, without OpenSSL (DF7 spike). Diesel pulls it in itself.
pq-sys.workspace = true
# Only for the online backup, which Diesel has no API for (M17); the same libsqlite3-sys as Diesel.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
# REFORGED_TEST_POSTGRES_URL, for the Postgres half of the tests
url.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true

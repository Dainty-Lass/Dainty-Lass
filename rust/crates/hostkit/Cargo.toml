[package]
name = "hostkit"
description = "The host kit: the reforged-host command line and configuration library (DL3b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
default = ["modules", "isles-1-14-7", "isles-1-12-0", "realms"]
modules = ["gateway", "allowlist", "content", "admin"]
gateway = []
allowlist = []
content = []
admin = ["controller/admin", "dep:admin"]
stub-module = ["controller/stub-module"]
isles-1-14-7 = []
isles-1-12-0 = []
revived-1-4-4 = []
realms = []
paradox = []
legacy = ["protocol/legacy"]

[dependencies]
admin = { workspace = true, optional = true }
aws-lc-rs.workspace = true
base64.workspace = true
bytes = "1"
chrono.workspace = true
clap.workspace = true
controller = { workspace = true, default-features = false, features = ["remote"] }
crossterm.workspace = true
epic.workspace = true
flate2.workspace = true
fs4 = "1"
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
module-api.workspace = true
network_plugin = { package = "network", path = "../../plugins/network", default-features = false, features = ["directory"] }
protocol.workspace = true
ratatui.workspace = true
remote.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
store.workspace = true
tar = { version = "0.4.46", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "time", "net", "io-std", "io-util", "rt-multi-thread", "sync"] }
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
admin.workspace = true
diesel.workspace = true
epic = { workspace = true, features = ["test-support"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
service-kit.workspace = true
tempfile.workspace = true

[lints]
workspace = true

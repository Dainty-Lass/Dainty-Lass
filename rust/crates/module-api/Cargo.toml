[package]
name = "module-api"
description = "DaintyLass's module framework: game versions, manifests, the module and plugin traits, and the out-of-process frame protocol (DD3-DD5)"
# Published to Forgejo's registry for the module repositories, so a real version (spike DF1)
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Born MIT (DD26): written here from nothing, from none of the upstream trees
license = "MIT"
repository.workspace = true
publish = ["silentspud"]

# The stub module as an executable, for the out-of-process tests (and DF3's)
[[bin]]
name = "module-api-stub"
path = "src/bin/module-api-stub.rs"
test = false
doc = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true

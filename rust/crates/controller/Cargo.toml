[package]
name = "controller"
description = "The server controller: runs named modules in one process with one status registry (docs/app-structure-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# Each module is the Rust service built into the binary; by default only MIT services (`admin`) are enabled so
# `controller` has zero normal AGPL dependencies (`services/host` enables `gateway`, `allowlist`, `content`, `network`)
default = ["admin", "remote"]
services = ["gateway", "allowlist", "content", "admin", "network", "remote", "chat"]
gateway = ["dep:gateway"]
allowlist = ["dep:gateway"]
content = ["dep:content"]
admin = ["dep:admin"]
remote = ["dep:remote"]
chat = ["dep:chat", "dep:store", "network_plugin/directory"]
# The node's network side (DD16): the directory, the home API, tickets, and peer log shipping (DH7), attached to the
# gateway's node links. It needs the gateway in this process, and a database for the directory
network = ["gateway", "network_plugin/directory", "network_plugin/log-ship", "dep:store", "dep:history-ship"]

# The game modules compiled in (DD3, DF5), none by default: each is a crate of its module repository under
# ../modules, linked as a path dependency
isles-1-14-7 = ["dep:isles-1-14-7"]
isles-1-12-0 = ["dep:isles-1-12-0"]
# rustic-rifts' server crates inside isles-1-14-7 (RF2)
realms = ["isles-1-14-7?/realms"]
# legacy-revived has no module crate yet (RV1): the feature is the name the bins and the release use, and links
# nothing until it does
revived-1-4-4 = []
# The module-api stub, a game module for tests and for trying a build (version 0.0.1)
stub-module = []

# A stub module as an executable, for the registry's out-of-process tests: it can start a grandchild
# and report its pid, so the tests see the whole tree go (DF3)
[[bin]]
name = "controller-test-module"
path = "src/bin/controller-test-module.rs"
test = false
doc = false

[dependencies]
admin = { workspace = true, optional = true }
chat = { workspace = true, optional = true }
isles-1-12-0 = { workspace = true, optional = true }
isles-1-14-7 = { workspace = true, optional = true }
content = { workspace = true, optional = true }
gateway = { workspace = true, optional = true }
history-ship = { workspace = true, optional = true }
# The node-link services and their registry (DN3-DN5); `directory` is the `network` feature's. Renamed as the gateway renames it
network_plugin = { package = "network", path = "../../plugins/network", default-features = false }
remote = { workspace = true, optional = true }
store = { workspace = true, optional = true }
# Game modules and plugins, compiled in or as their own process (DF3)
module-api.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "controller"
description = "The server controller: runs named modules in one process with one status registry (docs/app-structure-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# Each module is the Rust service built into the binary; none makes a controller that runs and serves nothing
default = ["gateway", "allowlist", "content", "admin"]
gateway = ["dep:gateway"]
allowlist = ["dep:gateway"]
content = ["dep:content"]
admin = ["dep:admin"]

# The game modules compiled in (DD3, DF5), none by default: each is a crate of its module repository under
# ../modules, linked as a path dependency
isles-1-14-7 = ["dep:isles-1-14-7"]
isles-1-12-0 = ["dep:isles-1-12-0"]
# rustic-rifts' server crates inside isles-1-14-7 (RF2)
realms = ["isles-1-14-7?/realms"]
# legacy-revived has no module crate yet (RV1): the feature is the name the bins and the release use, and links
# nothing until it does
revived-1-4-4 = []
# The module-api stub, a game module for tests and for trying a build (version 0.0.1)
stub-module = []

# A stub module as an executable, for the registry's out-of-process tests: it can start a grandchild
# and report its pid, so the tests see the whole tree go (DF3)
[[bin]]
name = "controller-test-module"
path = "src/bin/controller-test-module.rs"
test = false
doc = false

[dependencies]
admin = { workspace = true, optional = true }
isles-1-12-0 = { workspace = true, optional = true }
isles-1-14-7 = { workspace = true, optional = true }
content = { workspace = true, optional = true }
gateway = { workspace = true, optional = true }
# Game modules and plugins, compiled in or as their own process (DF3)
module-api.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "controller"
description = "Unified in-process server controller orchestrating gateway, allowlist, content, admin, backend, and director across editions (docs/app-structure-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["edition-both"]
edition-refined = [
    "protocol/edition-refined",
    "content/edition-refined",
    "backend/edition-refined",
    "director/edition-refined",
]
edition-reforged = [
    "protocol/edition-reforged",
    "content/edition-reforged",
    "backend/edition-reforged",
    "director/edition-reforged",
]
edition-both = [
    "edition-refined",
    "edition-reforged",
    "protocol/edition-both",
    "content/edition-both",
    "backend/edition-both",
    "director/edition-both",
]

[dependencies]
admin.workspace = true
aws-lc-rs.workspace = true
backend.workspace = true
base64.workspace = true
content.workspace = true
director.workspace = true
gateway.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
store.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "time", "sync", "signal"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

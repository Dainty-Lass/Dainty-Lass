# One cargo workspace for every Rust component (MIGRATION_PLAN.md, section 4.1): the shared crates, the
# services and the launcher backend. Copied from Dauntless Revived at e1c5fec (RD6). Every planned member
# is listed here from the start (RR1); a member that is still a stub is replaced by its skeleton row.
[workspace]
resolver = "3"
members = [
    "crates/controller",
    # Installing the game from the player's Epic library (DD22)
    "crates/epic",
    # The change log and snapshots shipped to an object-locked bucket, and restore (DH4)
    "crates/history-ship",
    "crates/module-api",
    "crates/protocol",
    "crates/proxy",
    "crates/service-kit",
    "crates/store",
    "services/gateway",
    "services/content",
    "services/host",
    "services/backend",
    "services/director",
    "services/admin",
    # The network core plugin: node links, the directory (DD16-DD18)
    "plugins/network",
    "launcher/src-tauri",
    # Core plugins (DD3): chat, XMPP over WebSocket (DD21, DN10)
    "plugins/chat",
    # What ships (RD26): the server in one binary (dainty-lass-server-console, and reforged-host, the name installs
    # run, DD1) and the same without a console. The launcher's two (dainty-lass-client, dainty-lass-server-gui) are
    # launcher/src-tauri's own, as `tauri build` needs
    "bins/server-console",
    "bins/server-minimal",
]
# The fuzz targets (cargo fuzz, nightly) are a workspace of their own, as is each module repository under
# ../modules (DD2): that entry is a no-op while this workspace sits in rust/, needed if its root moves up (DF1)
exclude = ["fuzz", "../modules"]

# The module repositories take DaintyLass's crates and rustic-rifts' as git dependencies at fixed revs (DD2, spike
# DF1's fallback). Inside this tree they must be these paths, or the module crates would build against a second
# copy of module-api and the controller could not load them as GameModule
[patch."ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git"]
module-api = { path = "crates/module-api" }
service-kit = { path = "crates/service-kit" }
store = { path = "crates/store" }

[patch."ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git"]
rifts-seam = { path = "../modules/rustic-rifts/crates/rifts-seam" }
rifts-admission = { path = "../modules/rustic-rifts/crates/rifts-admission" }
rifts-relay = { path = "../modules/rustic-rifts/crates/rifts-relay" }
rifts-realms = { path = "../modules/rustic-rifts/crates/rifts-realms" }
rifts-guard = { path = "../modules/rustic-rifts/crates/rifts-guard" }
rifts-host = { path = "../modules/rustic-rifts/crates/rifts-host" }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://git.silentspud.com/silentspud/dainty-lass"
publish = false

[workspace.dependencies]
controller = { path = "crates/controller" }
server-controller = { path = "crates/controller", package = "controller" }
# Published for the module repositories: registry = "silentspud" keeps cargo package from writing a crates.io
# dependency (spike DF1)
module-api = { path = "crates/module-api", version = "0.1.0", registry = "silentspud" }
protocol = { path = "crates/protocol" }
store = { path = "crates/store" }
history-ship = { path = "crates/history-ship" }
service-kit = { path = "crates/service-kit" }
proxy = { path = "crates/proxy" }
admin = { path = "services/admin" }
content = { path = "services/content" }
epic = { path = "crates/epic" }
# The game modules compiled into the server (DF5): Cargo features of the controller and the bins
isles-1-12-0 = { path = "../modules/rustic-isles/modules/isles-1-12-0" }
isles-1-14-7 = { path = "../modules/rustic-isles/modules/isles-1-14-7", default-features = false }
# The launcher's side of realms (RF7, DD12): linked behind launcher's `realms` feature
rifts-host = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "e70a670bb42f2e4102c08b910bab33e6c8b0e9ec" }
rifts-seam = { git = "ssh://git@git.silentspud.com:222/silentspud/rustic-rifts.git", rev = "e70a670bb42f2e4102c08b910bab33e6c8b0e9ec" }
gateway = { path = "services/gateway" }
host = { path = "services/host" }
launcher = { path = "launcher/src-tauri" }

crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# RSA token keys and CSPRNG (D10: aws-lc-rs, already in the tree through rustls and rcgen)
aws-lc-rs = "1.18"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "form", "ws"] }
aes-gcm = "0.11"
# The admin API's GraphQL schema (services/admin); no web framework integration, no playground
async-graphql = { version = "7", default-features = false }
base64 = "0.23"

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "postgres", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite", "postgres"] }
dotenvy = "0.15"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# HTTPS for the services' outgoing requests (D10: aws-lc-rs)
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-tokio", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# Bundled: one SQLite, built with the options in .cargo/config.toml, shared by Diesel and rusqlite (M17).
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
percent-encoding = "2"
# Bundled libpq without OpenSSL: no system libpq, no Perl on Windows, openssl-sys stays banned (D10, DF7 spike).
pq-sys = { version = "0.7", default-features = false, features = ["bundled_without_openssl"] }
regex = "1"
rusqlite = { version = "0.40", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
# Epic's manifests and chunks are pinned and checked by SHA-1 (crates/epic, DD22)
sha1 = "0.11"
# Epic sign-in and library only: the manifests and chunks are read by crates/epic itself (spike DE1)
egs-api = "=0.14.0"
thiserror = "2"
# host.toml: read, and written back keeping the host's own comments and layout
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tokio ={ version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
tracing = "0.1"
tracing-log = "0.2"
# TypeScript types from Rust types (the launcher bridge, L6)
ts-rs = "12"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "std", "tracing-log"] }
toml = "0.9"
rand = "0.10"
tempfile = "3"
# Network-wide ids, tagged with the owning node (DD18, crates/module-api)
ulid = "3"
# The chat plugin's (plugins/chat, from DR's metagame chat): constant-time comparisons, and the WebSocket clients
# of its parity tests (the version axum's ws uses)
subtle = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# A panic in a request handler is caught (CatchPanicLayer), but it still drops the request.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Section 2: servers catch a panicking request instead of dying, so panics unwind.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"

[package]
name = "backend"
description = "The game backend, Mystic Paradox's API in Rust (MIGRATION_PLAN.md RB rows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["edition-both"]
edition-refined = ["protocol/edition-refined"]
edition-reforged = ["protocol/edition-reforged"]
edition-both = ["edition-refined", "edition-reforged", "protocol/edition-both"]

[dependencies]
axum.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
store.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[lints]
workspace = true

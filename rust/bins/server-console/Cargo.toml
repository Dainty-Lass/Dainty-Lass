[package]
name = "server-console"
description = "The server in one binary: every reforged-host command, `serve` with its console or dashboard, and each service alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dainty-lass-server-console"
path = "src/main.rs"

# The same binary under the host kit's name, without `serve` as its default: `update`, the systemd units and
# the Director's game-server wrapper run bin/reforged-host (RD23)
[[bin]]
name = "reforged-host"
path = "src/bin/reforged-host.rs"

[features]
default = ["isles-1-14-7", "isles-1-12-0", "realms"]
# Opt-in rollback path for one release until RB15 deletes it: MongoDB and the Node backend and Director
paradox = ["host/paradox"]
# Dauntless Revived's 1.4.4 servers (legacy; RD5 reversed)
legacy = ["host/legacy"]
# One feature per compiled-in game module and one for realms (DD12, DF5); the release builds `all-modules` in.
# `stub-module` is module-api's stub, for tests
stub-module = ["host/stub-module"]
isles-1-14-7 = ["host/isles-1-14-7"]
isles-1-12-0 = ["host/isles-1-12-0"]
revived-1-4-4 = ["host/revived-1-4-4"]
realms = ["host/realms"]
all-modules = ["isles-1-14-7", "isles-1-12-0", "revived-1-4-4", "realms"]

[dependencies]
host = { workspace = true, default-features = false, features = ["modules"] }

[dev-dependencies]
controller = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

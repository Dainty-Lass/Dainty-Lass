[package]
name = "server-minimal"
description = "Headless zero-UI server binary supporting both Refined and Reforged editions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dainty-lass-server-minimal"
path = "src/main.rs"

[features]
default = []
# Dauntless Revived's 1.4.4 servers (legacy; RD5 reversed)
legacy = ["host/legacy"]

[dependencies]
host = { workspace = true, default-features = false, features = ["modules"] }

[lints]
workspace = true

# A legacy server (Dauntless Revived's 1.4.4) in Docker, on top of compose.yaml (docs/hosting-docker.md). In .env:
#
#   COMPOSE_FILE=compose.yaml:compose.legacy.yaml      (; instead of : on Windows)
#   COMPOSE_PROFILES=legacy,public                     (legacy alone for a private server; add toml as for reborn)
#   REFORGED_EDITION=legacy                            (the images built with the legacy features)
#
# The metagame and the deploy server (compose.yaml's legacy profile) take the backend's and the Director's ports,
# so Mystic Paradox's containers are moved to a profile a legacy server never turns on, and the content server
# and the gateway wait for the metagame instead of the backend.

services:
  mongo:
    profiles: [reborn]
  backend:
    profiles: [reborn]
  director:
    profiles: [reborn]
  admin:
    profiles: [reborn]

  content:
    depends_on: !override
      metagame:
        condition: service_healthy

  gateway:
    depends_on: !override
      net:
        condition: service_healthy
      metagame:
        condition: service_healthy
      content:
        condition: service_healthy
      allowlist:
        condition: service_healthy
        required: false

# Builds the server release (MIGRATION_PLAN.md RD8, RH6; adapted from Dauntless Revived's server-release.yml, M38).
# One archive per server platform, which `dainty-host setup` and `dainty-host update` download and check (RH5):
#  - DaintyLassServer-<version>-windows-x64.zip and -linux-x64.tar.gz hold dainty-lass-server-<version>/:
#    the source of the commit (git archive, the corresponding source under the AGPL) and of the rustic-isles
#    module in-tree (modules/rustic-isles, DS6/RD27), with
#      bin/              the server in one binary (RD26), built here for that platform: dainty-server,
#                        the same as dainty-host (the name update, the systemd units and the Director's
#                        game-server wrapper run), and dainty-server-minimal. The 1.14.7 Rust backend and
#                        Director (isles-1-14-7), gateway, allowlist, content server and admin API are inside it
#                        dainty-legacy, the legacy importer (MIT, from the root's crates/dainty-legacy)
#                        rustic-isles-runtime.dll and its .sha256, the prebuilt MIT game runtime (spec-runtime-r21 B-2)
#      data/1.14.7/version_data.json  Mystic Paradox's version data (AGPL), which the MIT binaries read at start
#      data/1.14.7/version_facts.json the 1.14.7 version facts (MIT), read beside version_data.json
#      plugins/          the libraries settings.toml can pin (RD27): the 1.14.7 module ([[modules.external]]) and, once
#                        their crates land, the content, chat and gateway services ([services.<name>])
#      modules/rustic-isles/game-data/1.14.7/  the game data's examples and store-captures.json (AGPL), from the tree
#      release.json      the version, commit, platform and repository, and every file of the release with its SHA-256
#  - SHA256SUMS.txt for the archives
#
# On Forgejo (DX3) it is the dry run only: Run workflow on any branch builds, smoke-tests and keeps the release files
# as a 7-day artifact (server-release). Publishing stays out until DX5: dainty-host update reads GitHub's releases
# API and checks GitHub attestations, which Forgejo has neither of. The tag trigger, the version checks and the
# publish job are in b28fd27:.github/workflows/server-release.yml.
# Runner labels docker and windows-msvc (docs/ci-runners.md). Actions are pinned by commit.
name: Server release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run's archives (default 0.0.0-dryrun.<run number>)"
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    name: Version
    runs-on: docker
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Work out the version
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # A semantic version without build metadata: x.y.z or x.y.z-prerelease
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          version="${INPUT_VERSION:-0.0.0-dryrun.$RUN_NUMBER}"
          [[ "$version" =~ $semver ]] || { echo "::error::$version is not a version (x.y.z or x.y.z-prerelease)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "servers $version, dry run"

  # The MIT game runtime, prebuilt once for both archives (spec-runtime-r21 B-2, call 6): an MSVC DLL that a Linux or
  # Docker host can't build. The R0 import and export checks run on this very file.
  runtime:
    name: Runtime DLL
    needs: prepare
    runs-on: windows-msvc
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths for git
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          # windows-msvc is the maintainer's PC (AGENTS.md)
          echo "CARGO_BUILD_JOBS=6" >> "$GITHUB_ENV"

      - name: Build rustic-isles-runtime.dll and check its tables
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-pc-windows-msvc -p rustic-isles-runtime
          cargo test --release --locked --target x86_64-pc-windows-msvc -p rustic-isles-runtime --test dll_file
          mkdir -p runtime-dll
          # cargo's library name can't hold '-': published under the name every consumer reads (RT-5)
          cp target/x86_64-pc-windows-msvc/release/rustic_isles_runtime.dll runtime-dll/rustic-isles-runtime.dll
          (cd runtime-dll && sha256sum rustic-isles-runtime.dll | tee rustic-isles-runtime.dll.sha256)

      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (v4.3.1, GHES check disabled)
        with:
          name: runtime-dll
          path: runtime-dll/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-msvc
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: docker
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      # Before the checkout: a submodule's objects under a deep path fail to clone without it (DF1)
      - name: Long paths for git
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's temporary folder as bash and GNU tar take it on every runner (tar reads D: as a remote host)
      - name: Work folder
        run: |
          work="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -u "$RUNNER_TEMP")"; fi
          echo "WORK=$work" >> "$GITHUB_ENV"

      # The docker label's image has Node for the actions but no Rust
      - name: Install rustup
        if: runner.os == 'Linux'
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          # windows-msvc is the maintainer's PC, which builds with 6 jobs or fewer (AGENTS.md)
          if [ "$RUNNER_OS" = Windows ]; then echo "CARGO_BUILD_JOBS=6" >> "$GITHUB_ENV"; fi

      # No build cache in a release: every file is built from this commit alone.
      # The 1.14.7 Rust backend and Director are compiled into dainty-server and dainty-server-minimal (all-modules).
      # DAINTY_RELEASE_REPOSITORY stays .cargo/config.toml's: the releases are on GitHub until DX5
      - name: Build the release binaries
        run: cargo build --release --locked --target "$TARGET" -p dainty-server -p dainty-server-minimal --features dainty-server/all-modules,dainty-server-minimal/all-modules --bins

      # The libraries the core loads (RD27), all from the MIT root: the 1.14.7 module and the services
      - name: Build the libraries
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" \
            -p rustic-isles-1-14-7-plugin -p dainty-content-plugin -p dainty-chat-plugin -p dainty-gateway-plugin --lib
          # The legacy importer, MIT since RD27: the external plugin `dainty-host legacy` runs
          cargo build --release --locked --target "$TARGET" -p dainty-legacy --bin dainty-legacy

      # release.json is written with Node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4 (v4.1.4, GHES check disabled)
        with:
          name: runtime-dll
          path: ${{ runner.temp }}/runtime-dll

      - name: Assemble the release folder
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          name="dainty-lass-server-$VERSION"
          out="$WORK/assemble/$name"
          rm -rf "$WORK/assemble" && mkdir -p "$out"
          # The commit's server source, as git has it (no .workspace, nothing git ignores); rustic-isles is in-tree (RD27)
          git archive --format=tar "$COMMIT:restricted" | tar -x -C "$out"
          mkdir -p "$out/bin"
          for bin in dainty-host dainty-server dainty-server-minimal dainty-legacy; do
            cp "target/$TARGET/release/$bin$ext" "$out/bin/"
          done
          # The prebuilt MIT runtime and its SHA-256: setup and publish-runtime publish it when the host built none
          # (spec-runtime-r21 call 6)
          cp "$WORK/runtime-dll/rustic-isles-runtime.dll" "$WORK/runtime-dll/rustic-isles-runtime.dll.sha256" "$out/bin/"
          (cd "$out/bin" && sha256sum -c rustic-isles-runtime.dll.sha256)
          # Mystic Paradox's 1.14.7 version data, AGPL, beside the MIT binaries: the server reads it at start (RD27)
          mkdir -p "$out/data/1.14.7"
          cp restricted/modules/rustic-isles/version-data/1.14.7/version_data.json "$out/data/1.14.7/"
          # The 1.14.7 version facts (MIT) beside the design (port plan item 9)
          cp crates/rustic-isles-1-14-7/data/version_facts.json "$out/data/1.14.7/"
          # The libraries beside them, under the names settings.toml's paths give (RD27)
          mkdir -p "$out/plugins"
          if [ "$RUNNER_OS" = Windows ]; then prefix=""; suffix=".dll"; else prefix="lib"; suffix=".so"; fi
          for lib in rustic_isles_1_14_7_plugin dainty_content_plugin dainty_chat_plugin dainty_gateway_plugin; do
            cp "target/$TARGET/release/$prefix$lib$suffix" "$out/plugins/"
          done
          echo "$COMMIT" > "$out/COMMIT"
          # release.json: what update reads, and every file with its SHA-256 (update removes the files an older
          # release had and this one has not, and checks what it installed)
          node - "$out" "$VERSION" "$COMMIT" "$TARGET" "$PLATFORM" "$GITHUB_REPOSITORY" <<'EOF'
          const fs = require("fs"), path = require("path"), crypto = require("crypto");
          const [root, version, commit, target, platform, repository] = process.argv.slice(2);
          const files = [];
          (function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true }).sort((a, b) => (a.name < b.name ? -1 : 1))) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) walk(full);
              else if (e.isFile()) {
                const data = fs.readFileSync(full);
                files.push({ path: path.relative(root, full).split(path.sep).join("/"), sha256: crypto.createHash("sha256").update(data).digest("hex"), size: data.length });
              } else if (e.isSymbolicLink()) throw new Error(`a symbolic link in the release: ${full}`);
            }
          })(root);
          const manifest = { name: "dainty-lass-server", version, commit, target, platform, repository, files };
          fs.writeFileSync(path.join(root, "release.json"), JSON.stringify(manifest, null, 2) + "\n");
          console.log(`release.json: ${files.length} files`);
          EOF

      - name: Smoke test, the binaries start
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          bin="$WORK/assemble/dainty-lass-server-$VERSION/bin"
          for b in dainty-host dainty-server dainty-server-minimal; do "$bin/$b$ext" --help > /dev/null; done
          # With no arguments it waits for frames on stdin, so the smoke test asks for usage instead
          if "$bin/dainty-legacy$ext" import 2> /dev/null; then echo "dainty-legacy took no kind"; exit 1; fi
          test -s "$bin/../data/1.14.7/version_data.json"
          test -s "$bin/../data/1.14.7/version_facts.json"
          test -s "$bin/rustic-isles-runtime.dll"
          test -s "$bin/../modules/rustic-isles/game-data/1.14.7/store-captures.json"
          # Each service the binary runs alone, as the systemd units and the containers run it
          for service in gateway allowlist content backend director; do "$bin/dainty-host$ext" "$service" --help > /dev/null; done
          for db_cmd in migrate verify; do "$bin/dainty-host$ext" db "$db_cmd" --help > /dev/null; done
          "$bin/dainty-host$ext" admin schema > /dev/null
          "$bin/dainty-host$ext" --help

      - name: Make the archive
        run: |
          set -euo pipefail
          name="dainty-lass-server-$VERSION"
          mkdir -p "$WORK/release"
          cd "$WORK/assemble"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="DaintyLassServer-$VERSION-$PLATFORM.zip"
            7z a -tzip -mx=9 -bd "$WORK/release/$archive" "$name" > /dev/null
          else
            archive="DaintyLassServer-$VERSION-$PLATFORM.tar.gz"
            tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$WORK/release/$archive" "$name"
          fi
          ls -l "$WORK/release"

      # Stock upload-artifact v4+ refuses any host but github.com; Forgejo's fork drops that check
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (v4.3.1, GHES check disabled)
        with:
          name: server-archive-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Release files
    needs: [prepare, build]
    runs-on: docker
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4 (v4.1.4, GHES check disabled)
        with:
          pattern: server-archive-*
          path: release
          merge-multiple: true

      - name: SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release
          expected="$(printf '%s\n' "DaintyLassServer-$VERSION-linux-x64.tar.gz" "DaintyLassServer-$VERSION-windows-x64.zip" | sort)"
          actual="$(ls -A | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::these are not the archives of servers $VERSION"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4 (v4.3.1, GHES check disabled)
        with:
          name: server-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  # The archives install as setup and update install them: from the release files, checked against SHA256SUMS.txt.
  try:
    name: Install (${{ matrix.platform }})
    needs: [prepare, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-msvc
            platform: windows-x64
          - os: docker
            platform: linux-x64
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4 (v4.1.4, GHES check disabled)
        with:
          name: server-release
          path: ${{ runner.temp }}/release

      - name: Extract, then check the install with dainty-host update --check
        env:
          DAINTY_SERVER_RELEASE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p "$RUNNER_TEMP/host"
          cd "$RUNNER_TEMP/host"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bd "$DAINTY_SERVER_RELEASE/DaintyLassServer-$VERSION-$PLATFORM.zip" > /dev/null
          else
            tar -xzf "$DAINTY_SERVER_RELEASE/DaintyLassServer-$VERSION-$PLATFORM.tar.gz"
          fi
          root="$RUNNER_TEMP/host/dainty-lass-server-$VERSION"
          "$root/bin/dainty-host$ext" update --check | tee check.txt
          grep -q "Up to date" check.txt

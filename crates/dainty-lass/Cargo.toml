[package]
name = "dainty-lass"
description = "The MIT core server (RD27): the admin API and remote management built in, every other service a library host.toml pins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dainty-lass"
path = "src/main.rs"

[features]
# tokio-console on 127.0.0.1:6669, per task and named per module; needs `--cfg tokio_unstable` (docs/tokio-console.md)
tokio-console = ["dainty-hostkit/tokio-console"]

[dependencies]
clap.workspace = true
dainty-hostkit = { workspace = true, default-features = false, features = ["admin"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "rustic-isles-1-14-7"
description = "Rustic Isles for Dauntless 1.14.7: the version's tables, hooks and Director values, and the composer that wires every rustic-isles area and the Rustic Rifts crates into one module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite from docs/port/spec-rustic-isles-1-14-7.md (RD27, docs/port/clean-room/rustic-isles-1-14-7.md)
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rustic-isles-1-14-7"
path = "src/main.rs"
test = false
doc = false

[features]
default = ["realms"]
# Rustic Rifts' realms, admission, relay and guard; off, the module is dedicated-only
realms = ["dep:rifts-admission", "dep:rifts-relay", "dep:rifts-realms", "dep:rifts-guard"]
# A synthetic VersionData (made-up ids, never the real values)
test-support = []

[dependencies]
axum.workspace = true
http.workspace = true
module-api.workspace = true
rifts-admission = { workspace = true, optional = true }
rifts-guard = { workspace = true, optional = true }
rifts-realms = { workspace = true, optional = true }
rifts-relay = { workspace = true, optional = true }
rifts-seam.workspace = true
rustic-isles.workspace = true
rustic-isles-auth.workspace = true
rustic-isles-characters.workspace = true
rustic-isles-chat.workspace = true
# LegacyStarter, the db tool's starter values (db spec §14.3)
rustic-isles-db.workspace = true
rustic-isles-director.workspace = true
rustic-isles-economy.workspace = true
rustic-isles-gamedata.workspace = true
rustic-isles-matchmaking.workspace = true
rustic-isles-launcher-api.workspace = true
rustic-isles-store.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
service-kit.workspace = true
store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
rustic-isles = { workspace = true, features = ["test-support"] }
rustic-isles-auth = { workspace = true, features = ["test-support"] }
rustic-isles-store = { workspace = true, features = ["test-support"] }
rustic-isles-1-14-7 = { path = ".", default-features = false, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

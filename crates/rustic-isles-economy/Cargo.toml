[package]
name = "rustic-isles-economy"
description = "Rustic Isles' economy areas: inventory and the weapon reforge, progression, bounties, cooldowns, the wallet and the stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite from docs/port/spec-rustic-isles-economy-{inventory,progression,bounties}.md (RD27,
# docs/port/clean-room/rustic-isles-economy.md)
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# Synthetic game-data writers for the crate's own tests and the composer's
test-support = []

[dependencies]
axum.workspace = true
http.workspace = true
module-api.workspace = true
rifts-seam.workspace = true
rustic-isles.workspace = true
rustic-isles-auth.workspace = true
rustic-isles-characters.workspace = true
rustic-isles-gamedata.workspace = true
rustic-isles-store.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
service-kit.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
rustic-isles = { workspace = true, features = ["test-support"] }
rustic-isles-auth = { workspace = true, features = ["test-support"] }
rustic-isles-economy = { path = ".", features = ["test-support"] }
rustic-isles-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower.workspace = true

[lints]
workspace = true

[package]
name = "dainty-epic"
description = "Installing Dauntless from the player's Epic library: sign-in, library, manifests, chunks, download (docs/dainty-lass-plan.md DD22, DE1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Born MIT (DD26): written from Epic's documented manifest and chunk formats, from none of DR, Paradox or Reforged
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# The synthetic manifests and chunks and the fake CDN (`testing`), for the host kit's tests (DE6)
test-support = ["dep:rcgen", "dep:tokio-rustls", "hyper/server", "tokio/net", "tokio/io-util", "tokio/rt-multi-thread"]

[dependencies]
dainty-http.workspace = true
# The CDN client (download/cdn.rs): HTTPS only, no redirect followed
bytes.workspace = true
egs-api.workspace = true
flate2.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
# The MD5 2.1.1's manifests list beside the SHA-1
md-5.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
# The executable's SHA-256 from the client profile, and a manifest's own where it carries them
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "fs", "macros"] }
# test-support only
rcgen = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
hyper-rustls.workspace = true
hyper = { workspace = true, features = ["server"] }
# The fake CDN's certificate and listeners (download/tests.rs)
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true

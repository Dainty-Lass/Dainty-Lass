[package]
name = "dainty-legacy"
description = "Imports old installs into Dainty Lass: a Dauntless Revived 1.4.4 server or offline save into the 1.14.7 database, and a Reforged Node kit's host.json, folders and MongoDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite from docs/port/spec-legacy-import.md (RD27, L-1)
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

# With no arguments the plugin out of process (L-2); with `import <kind> ...` the command line
[[bin]]
name = "dainty-legacy"
path = "src/main.rs"
test = false
doc = false

[dependencies]
chrono.workspace = true
dainty-module-api.workspace = true
dainty-store.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
hex.workspace = true
rustic-isles-characters.workspace = true
rustic-isles-db.workspace = true
rustic-isles-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
rustic-isles-db = { workspace = true, features = ["test-support"] }
rustic-isles-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

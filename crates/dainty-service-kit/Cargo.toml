[package]
name = "dainty-service-kit"
description = "Shared HTTP routing, body parsing, rate limiting, logging, env loading, and lifecycle helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
# Serves tokio-console on 127.0.0.1:6669; needs `--cfg tokio_unstable` (docs/tokio-console.md)
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
dainty-http.workspace = true
anstream.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
console-subscriber = { workspace = true, optional = true }
dotenvy.workspace = true
flate2.workspace = true
gethostname.workspace = true
http-body-util.workspace = true
# GELF over HTTPS (gelf.rs)
hyper.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal", "io-std", "io-util", "time", "sync", "rt"] }
tokio-metrics.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
flate2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

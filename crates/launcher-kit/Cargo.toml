[package]
name = "launcher-kit"
description = "Clean-room MIT launcher logic for DaintyLass (`docs/port/spec-dl4-launcher.md`, DL4b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
epic.workspace = true
module-api = { path = "../module-api" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit.workspace = true
dirs = "6"
fs4 = "1"
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
sha2.workspace = true
sha1.workspace = true
chrono.workspace = true
bytes = "1"
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1"] }
rustls.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util", "sync", "macros", "rt", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util.workspace = true
webpki-roots = "1"
percent-encoding.workspace = true
rand.workspace = true
futures-util.workspace = true
base64.workspace = true
url.workspace = true
# The pooled client's connector (net/connector.rs)
tower.workspace = true
ts-rs = { workspace = true, optional = true }
# The key store (platform/keystore): AES-GCM files, and the old Electron launcher's AES-CBC files
aes.workspace = true
aes-gcm.workspace = true
cbc.workspace = true
pbkdf2.workspace = true

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service.workspace = true

[dev-dependencies]
# The fake CDN and synthetic versions for the install job (net/epic_install.rs)
epic = { workspace = true, features = ["test-support"] }
sha1_smol = "1"
tokio-stream = "0.1"
tempfile.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
protocol = { workspace = true, features = ["ts"] }
ts-rs.workspace = true

[features]
default = ["host"]
host = []
server-gui = ["host"]
realms = []
ts = ["dep:ts-rs", "protocol/ts"]

[lints]
workspace = true

[package]
name = "dainty-launcher-app"
description = "The MIT Tauri shell of the Dainty Lass launcher (RD27 spec §2.1, RL13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true
# The bundles' file name; the package name `launcher` is restricted's
default-run = "dainty-launcher"

[lib]
name = "dainty_launcher_app"

[[bin]]
name = "dainty-launcher"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
dainty-launcher-kit = { workspace = true, default-features = false }
dainty-protocol.workspace = true
dainty-epic.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
url.workspace = true
futures-util.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["host", "realms"]
host = ["dainty-launcher-kit/host"]
realms = ["dainty-launcher-kit/realms"]
# The manager's feature; its embedded server is restricted's host crate, handed in through `run_with`
server-gui = ["host", "dainty-launcher-kit/server-gui"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

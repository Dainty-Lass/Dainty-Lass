[package]
name = "dainty-launcher-app"
description = "The MIT Tauri shell of the Dainty Lass launcher (RD27 spec §2.1, RL13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true
# The bundles' file name
default-run = "dainty-launcher"

[lib]
name = "dainty_launcher_app"

[[bin]]
name = "dainty-launcher"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
dainty-launcher-kit = { workspace = true, default-features = false }
dainty-protocol.workspace = true
dainty-epic.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
url.workspace = true
futures-util.workspace = true
sys-locale.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
# The manager's embedded server (spec-tauri-shell §11.1)
dainty-manager-server = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
toml_edit.workspace = true

[features]
default = ["host", "realms"]
host = ["dainty-launcher-kit/host"]
realms = ["dainty-launcher-kit/realms", "dainty-manager-server?/realms"]
# The manager: its embedded server runs the host kit in this process (RD26) with the 1.14.7 module and realms
server-gui = [
    "host",
    "dainty-launcher-kit/server-gui",
    "dep:dainty-manager-server",
    "isles-1-14-7",
    "dainty-manager-server/realms",
]
# The host's game modules (DF5), for a manager
isles-1-14-7 = ["dainty-manager-server?/isles-1-14-7"]
stub-module = ["dainty-manager-server?/stub-module"]
all-modules = ["isles-1-14-7", "stub-module"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[package]
name = "rustic-isles-db"
description = "Rustic Isles' database tool: migrate a MongoDB 1.14.7 deployment into the store with the RB11 repairs, verify it, and export it back (RB13)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite from docs/port/spec-rustic-isles-db.md (RD27, docs/port/clean-room/rustic-isles-db.md)
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
default = ["export-mongo"]
# RB13's one-release rollback; RB15 turns it off and deletes it
export-mongo = []
# MockMongoServer: an OP_MSG server on 127.0.0.1:0 for this crate's tests and the host's
test-support = []

[dependencies]
base64.workspace = true
chrono.workspace = true
diesel.workspace = true
hex.workspace = true
hmac.workspace = true
dainty-module-api.workspace = true
percent-encoding.workspace = true
rand.workspace = true
rustic-isles.workspace = true
rustic-isles-characters.workspace = true
rustic-isles-economy.workspace = true
rustic-isles-store.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
sha2.workspace = true
dainty-store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
rustic-isles-db = { path = ".", features = ["test-support"] }
rustic-isles-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

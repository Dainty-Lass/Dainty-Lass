[package]
name = "dainty-host"
description = "The host kit composed with the services and the 1.14.7 module: what the server binaries run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
default = ["modules", "isles-1-14-7", "realms"]
# The server's modules (`serve`): the Rust services in this process, composed in compose.rs (RD27). None: a
# controller that serves nothing
modules = ["gateway", "allowlist", "content", "admin", "chat", "discord"]
# The gateway brings the node's network side (DD16) and remote management: they attach to its node links
gateway = ["dainty-controller/network", "dainty-controller/remote", "network_plugin/log-ship", "dep:dainty-gateway", "dep:dainty-history-ship"]
# The allowlist runs inside the gateway service, compiled in as in its library (RD27)
allowlist = ["gateway"]
content = ["dep:dainty-content"]
admin = ["dainty-controller/admin", "dep:dainty-admin", "dainty-hostkit/admin"]
chat = ["dep:dainty-chat"]
# The Discord bot (module sharing A7), composed by the host kit
discord = ["dainty-hostkit/discord"]
# tokio-console on 127.0.0.1:6669, per task and named per module; needs `--cfg tokio_unstable` (docs/tokio-console.md)
tokio-console = ["dainty-hostkit/tokio-console"]
# The game modules compiled in (DF5); 1.14.7 and realms are on by default (RU9/RB14)
stub-module = ["dainty-controller/stub-module"]
# The 1.14.7 module; its version data is read at start from the file settings.toml names (version_data.rs)
isles-1-14-7 = ["db-tools", "dep:rustic-isles", "dep:rustic-isles-director", "dep:rustic-isles-gamedata"]
realms = ["rustic-isles-1-14-7?/realms"]
# `dainty-host db`, which takes the legacy starter from the version data
db-tools = ["dep:rustic-isles-1-14-7", "dep:rustic-isles-db", "dep:rustic-isles-replay"]

[dependencies]
dainty-hostkit = { workspace = true, default-features = false }
# The backend's token keys, RSA 4096 (D10: aws-lc-rs; already in the tree through rustls and rcgen).
aws-lc-rs.workspace = true
base64.workspace = true
# `update` and setup's install step: the server release over HTTPS (D10: rustls with aws-lc-rs, as the content server)
bytes = "1"
# The supervisor's log lines (`===== <ISO time> starting ...`, as the Node kit's)
chrono.workspace = true
clap.workspace = true
dainty-controller = { workspace = true, default-features = false }
# [modules]: module ids, pinned digests, node names (DF3)
dainty-module-api.workspace = true
# `network ca-init`, `issue-node-cert` and `join`, and the peers in `[[network.nodes]]` (DN3, DN13). Renamed as the gateway renames it
network_plugin = { workspace = true, features = ["directory"] }
crossterm.workspace = true
# RH4: game data packs are gzip-compressed JSON.
flate2.workspace = true
# `install-game`: Dauntless from the host's own Epic library (DE6)
dainty-epic.workspace = true
# Free space for it, as the launcher checks; hoist into [workspace.dependencies] with the next pass
fs4 = "1"
# The services built into this binary (`dainty-host gateway|allowlist|content|admin`, RD26), and the
# public gateway's certificate on a first `serve`
dainty-admin = { workspace = true, optional = true }
dainty-content = { workspace = true, optional = true }
dainty-gateway = { workspace = true, optional = true }
dainty-chat = { workspace = true, optional = true }
# The peer log shipping the network module runs (DH7)
dainty-history-ship = { workspace = true, optional = true }
rustic-isles = { workspace = true, optional = true }
rustic-isles-1-14-7 = { workspace = true, optional = true }
rustic-isles-db = { workspace = true, optional = true }
rustic-isles-director = { workspace = true, optional = true }
rustic-isles-gamedata = { workspace = true, optional = true }
rustic-isles-replay = { workspace = true, optional = true }
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
# The invite links (section 6).
dainty-protocol.workspace = true
dainty-remote.workspace = true
ratatui.workspace = true
# Reading the certificate a port serves (doctor), and the release downloads.
rustls.workspace = true
# host.json in JavaScript's key order and number text (service-kit turns on preserve_order).
serde_json.workspace = true
dainty-service-kit.workspace = true
# Chat as a library the core loads (RD27): its setup
dainty-service-plugin.workspace = true
sha2.workspace = true
dainty-store.workspace = true
# The Linux release is a .tar.gz, the Windows one a .zip.
tar = { version = "0.4.46", default-features = false }
thiserror.workspace = true
toml_edit.workspace = true
# `start`: Ctrl+C, Ctrl+Break and closing the console on Windows; SIGINT, SIGTERM and SIGHUP elsewhere
tokio = { workspace = true, features = ["signal", "time", "net", "io-std", "io-util", "rt-multi-thread", "sync"] }
tracing.workspace = true
url.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
# `start`: one job object per service, so its whole process tree stops with it (RD3)
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
# `start`: the services' process groups (kill(2)) and, on Linux, PR_SET_PDEATHSIG
libc = "0.2.191"

[dev-dependencies]
# install-game's tests: synthetic manifests and chunks and a fake CDN (DE6)
dainty-epic = { workspace = true, features = ["test-support"] }
# Test certificates, as the gateway makes them.
rcgen.workspace = true
tempfile.workspace = true
# admin.env read back by the admin API itself, and its GraphQL answers (tests/admin_network.rs)
async-graphql.workspace = true
dainty-admin.workspace = true
# A game database to revert in, made without the game module's migrations
diesel.workspace = true
dainty-service-kit.workspace = true
# db migrate's tests: a MongoDB stand-in
rustic-isles-db = { workspace = true, features = ["test-support"] }
# The synthetic version_data.json the tests serve with
rustic-isles-1-14-7 = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

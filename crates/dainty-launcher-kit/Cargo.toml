[package]
name = "dainty-launcher-kit"
description = "Clean-room MIT launcher logic for Dainty Lass (`docs/port/spec-dl4-launcher.md`, DL4b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

# The tests' stand-in for `dainty-host` (RD27 spec §2.10)
[[bin]]
name = "fake-host-kit"
path = "tests/fixtures/host/fake_host_kit.rs"
test = false
doc = false
bench = false

[build-dependencies]
serde_json.workspace = true

[dependencies]
dainty-http.workspace = true
dainty-protocol.workspace = true
# The game's relay, shared with the runtime (net/relay.rs)
dainty-relay.workspace = true
# Loads the runtime and the Host tools into the game, and the Proton helper's command line (platform/inject.rs)
dainty-inject.workspace = true
dainty-epic.workspace = true
dainty-module-api = { path = "../dainty-module-api" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit.workspace = true
dirs = "6"
fs4 = "1"
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
sha2.workspace = true
sha1.workspace = true
chrono.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1"] }
rustls.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util", "sync", "macros", "rt", "process", "fs"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
rand.workspace = true
futures-util.workspace = true
hex.workspace = true
base64.workspace = true
# Crash report bundles (platform/crash.rs)
flate2.workspace = true
url.workspace = true
# The pooled client's connector (net/connector.rs)
tower.workspace = true
# The relay's header rules and tunnel (net/relay.rs)
dainty-proxy.workspace = true
ts-rs = { workspace = true, optional = true }
# The key store (platform/keystore): AES-GCM files, and the old Electron launcher's AES-CBC files
aes.workspace = true
aes-gcm.workspace = true
cbc.workspace = true
pbkdf2.workspace = true
# The realm adapter (controller/realms.rs)
rustic-rifts-host = { workspace = true, optional = true }
rustic-rifts-seam = { workspace = true, optional = true }
# The server manager's guarded actions (controller/guarded.rs)
dainty-hostkit = { workspace = true, optional = true, default-features = false, features = ["admin"] }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service.workspace = true

[dev-dependencies]
dainty-relay = { workspace = true, features = ["test-support"] }
# The fake CDN and synthetic versions for the install job (net/epic_install.rs)
dainty-epic = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rcgen.workspace = true
dainty-protocol = { workspace = true, features = ["ts"] }
ts-rs.workspace = true

[features]
default = ["host"]
host = []
server-gui = ["host", "dep:dainty-hostkit"]
realms = ["dep:rustic-rifts-host", "dep:rustic-rifts-seam"]
ts = ["dep:ts-rs", "dainty-protocol/ts"]

[lints]
workspace = true

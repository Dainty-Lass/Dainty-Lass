[package]
name = "dainty-controller"
description = "The server controller: runs named modules in one process with one status registry (docs/app-structure-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# The MIT services built into the binary (`admin`, `remote`, `discord`). The AGPL services are composed by
# dainty-restricted's host until each is a library the core loads (RD27)
default = ["admin", "remote", "events", "discord"]
services = ["admin", "remote", "events", "discord"]
admin = ["dep:dainty-admin"]
# The Discord bot (module sharing A7)
discord = ["dep:dainty-discord"]
remote = ["dep:dainty-remote"]
# The event recorder (module sharing A5): the registry's events kept in `store`
events = ["dep:dainty-store", "dep:diesel", "dep:diesel_migrations"]
# The node's network side (DD16): the directory, the home API, tickets, and peer log shipping (DH7). A database
# holds the directory; dainty-restricted's host attaches it to the gateway's node links
network = ["network_plugin/directory", "network_plugin/log-ship", "dep:dainty-store", "dep:dainty-history-ship"]

# The module-api stub, a game module for tests and for trying a build (version 0.0.1)
stub-module = []

# A stub module as an executable, for the registry's out-of-process tests: it can start a grandchild
# and report its pid, so the tests see the whole tree go (DF3)
[[bin]]
name = "controller-test-module"
path = "src/bin/controller-test-module.rs"
test = false
doc = false

[dependencies]
dainty-admin = { workspace = true, optional = true }
dainty-discord = { path = "../dainty-discord", optional = true }
dainty-history-ship = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
# The node-link services and their registry (DN3-DN5); `directory` is the `network` feature's. Renamed as the gateway renames it
network_plugin = { package = "dainty-network", path = "../../crates/dainty-network", default-features = false }
dainty-remote = { workspace = true, optional = true }
dainty-store = { workspace = true, optional = true }
# Game modules and plugins, compiled in, as their own process (DF3) or as a library (RD27)
dainty-module-api.workspace = true
dainty-plugin-host.workspace = true
# Services as libraries (RD27): their protocol
dainty-service-plugin.workspace = true
dainty-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
dainty-service-kit.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
tempfile.workspace = true

[lints]
workspace = true

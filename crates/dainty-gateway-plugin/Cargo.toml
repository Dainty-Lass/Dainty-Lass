[package]
name = "dainty-gateway-plugin"
description = "The gateway and the allowlist as one library the core loads (RD27)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[lib]
name = "dainty_gateway_plugin"
crate-type = ["cdylib"]

[dependencies]
dainty-gateway.workspace = true
# export_service! names it
dainty-module-api.workspace = true
dainty-service-plugin.workspace = true

[dev-dependencies]
# The parity harness and helpers the gateway's own tests run (crates/dainty-gateway/tests)
# dainty_protocol::renamed reads the recordings under the new names
dainty-protocol.workspace = true
axum.workspace = true
base64.workspace = true
bytes = "1"
dainty-controller = { workspace = true, features = ["network"] }
futures-util.workspace = true
dainty-gateway.workspace = true
http = "1"
http-body = "1"
http-body-util.workspace = true
hyper.workspace = true
network_plugin = { package = "dainty-network", path = "../../crates/dainty-network", default-features = false }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "server"] }
regex.workspace = true
rustls.workspace = true
serde_json.workspace = true
dainty-service-kit.workspace = true
sha1 = "0.10"
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[package]
name = "dainty-gateway"
description = "The gateway, the only listener off loopback, and the allowlist helper that opens the game ports (RD27, rewritten clean-room)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Rewritten from docs/port/spec-rd27-gateway*.md alone (docs/port/clean-room/gateway.md)
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
dainty-module-api.workspace = true
network_plugin = { package = "dainty-network", path = "../../crates/dainty-network", default-features = false }
dainty-protocol.workspace = true
dainty-proxy.workspace = true
rcgen.workspace = true
regex.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
dainty-service-kit.workspace = true
dainty-service-plugin.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs", "signal"] }
tokio-rustls.workspace = true
tracing.workspace = true
url.workspace = true
x509-parser.workspace = true

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant"] }

[dev-dependencies]
base64.workspace = true
# The moved tests: the launcher's region routes (launcher_region), node links and the home API (nodelink, home)
dainty-launcher-kit.workspace = true
futures-util.workspace = true
# The fake WebSocket upstream's Sec-WebSocket-Accept
sha1.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

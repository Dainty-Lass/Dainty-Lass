[package]
name = "content-plugin"
description = "The content server as a library the core loads (RD27)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[lib]
name = "content_plugin"
crate-type = ["cdylib"]

[dependencies]
content.workspace = true
# export_service! names them
module-api.workspace = true
service-plugin.workspace = true

[dev-dependencies]
# The parity harness content's own tests run (crates/content/tests/parity/harness.rs)
axum.workspace = true
content.workspace = true
controller.workspace = true
module-api.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[lints]
workspace = true

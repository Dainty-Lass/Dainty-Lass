[package]
name = "dainty-plugin-host"
description = "Loads modules built as libraries and drives them over the frame protocol (RD27)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
# The same version dainty-restricted's realms crates take, so one copy lands in its tree
libloading = "0.7"
dainty-module-api.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package]
name = "dainty-chat"
description = "The chat core plugin (DD21, DN10a): XMPP over WebSocket on loopback behind the gateway, rooms, direct messages with offline delivery, history and mutes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite of the DR-derived files (RD27, docs/port/clean-room/chat.md)
license = "MIT"
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
futures-util.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
dainty-module-api.workspace = true
dainty-network = { path = "../dainty-network", default-features = false }
dainty-protocol.workspace = true
rand.workspace = true
regex.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
dainty-service-kit.workspace = true
# chat::service: the same service compiled in or as chat-plugin's library (RD27)
dainty-service-plugin.workspace = true
sha2.workspace = true
dainty-store.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tracing.workspace = true
ulid.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
# The node-link listener the mutual-TLS federation test serves (the gateway's job, spec-rd27-chat §6.3)
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite.workspace = true
# REFORGED_TEST_POSTGRES_URL, for the Postgres half of the history tests
url.workspace = true

[lints]
workspace = true

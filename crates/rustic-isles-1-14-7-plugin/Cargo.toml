[package]
name = "rustic-isles-1-14-7-plugin"
description = "Rustic Isles for Dauntless 1.14.7 as a library the Dainty Lass core loads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite from docs/port/spec-rustic-isles-1-14-7.md §9.4 (RD27)
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[lib]
name = "rustic_isles_1_14_7_plugin"
crate-type = ["cdylib"]

[features]
default = ["realms"]
realms = ["rustic-isles-1-14-7/realms"]

[dependencies]
dainty-module-api.workspace = true
rustic-isles.workspace = true
rustic-isles-1-14-7 = { workspace = true, default-features = false }

[dev-dependencies]
dainty-module-api.workspace = true
dainty-plugin-host.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

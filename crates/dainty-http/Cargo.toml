[package]
name = "dainty-http"
description = "The services' one outgoing HTTP/1.1 client: webpki roots on aws-lc-rs, a time limit and a body limit on every call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls.workspace = true
tokio = { workspace = true, features = ["time"] }
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true

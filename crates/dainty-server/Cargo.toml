[package]
name = "dainty-server"
description = "The server in one binary: every dainty-host command, `serve` with its console or dashboard, and each service alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Born here (RD26, DF5): glue over the MIT dainty-host, which reads the 1.14.7 version data at start (RD27)
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dainty-server"
path = "src/main.rs"

# The same binary under the host kit's name, without `serve` as its default: `update`, the systemd units and
# the Director's game-server wrapper run bin/dainty-host (RD23)
[[bin]]
name = "dainty-host"
path = "src/bin/dainty-host.rs"

[features]
default = ["isles-1-14-7", "realms"]
# One feature per compiled-in game module and one for realms (DD12, DF5); the release builds `all-modules` in.
# `stub-module` is module-api's stub, for tests
stub-module = ["dainty-host/stub-module"]
isles-1-14-7 = ["dainty-host/isles-1-14-7"]
realms = ["dainty-host/realms"]
all-modules = ["isles-1-14-7", "realms"]
# tokio-console on 127.0.0.1:6669, per task and named per module; needs `--cfg tokio_unstable` (docs/tokio-console.md)
tokio-console = ["dainty-host/tokio-console"]

[dependencies]
dainty-host = { workspace = true, default-features = false, features = ["modules"] }

[dev-dependencies]
dainty-controller = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package]
name = "rifts-host"
description = "Rustic Rifts' launcher side: the transport as a trait, the host PC's files, realm hosting and joining"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
default = ["in-process"]
# The transport linked into the launcher (umbrella spec D1); without it every load is refused
in-process = ["dep:rifts-transport"]

[dependencies]
# The system random source, for session folder and pipe names
rand.workspace = true
rifts-seam.workspace = true
rifts-transport = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
p256.workspace = true
rifts-admission.workspace = true
tempfile.workspace = true

[lints]
workspace = true

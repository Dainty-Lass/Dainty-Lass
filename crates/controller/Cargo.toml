[package]
name = "controller"
description = "The server controller: runs named modules in one process with one status registry (docs/app-structure-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[features]
# The MIT services built into the binary (`admin`, `remote`). The AGPL services are composed by dainty-restricted's
# host until each is a library the core loads (RD27)
default = ["admin", "remote"]
services = ["admin", "remote"]
admin = ["dep:admin"]
remote = ["dep:remote"]
# The node's network side (DD16): the directory, the home API, tickets, and peer log shipping (DH7). A database
# holds the directory; dainty-restricted's host attaches it to the gateway's node links
network = ["network_plugin/directory", "network_plugin/log-ship", "dep:store", "dep:history-ship"]

# The module-api stub, a game module for tests and for trying a build (version 0.0.1)
stub-module = []

# A stub module as an executable, for the registry's out-of-process tests: it can start a grandchild
# and report its pid, so the tests see the whole tree go (DF3)
[[bin]]
name = "controller-test-module"
path = "src/bin/controller-test-module.rs"
test = false
doc = false

[dependencies]
admin = { workspace = true, optional = true }
history-ship = { workspace = true, optional = true }
# The node-link services and their registry (DN3-DN5); `directory` is the `network` feature's. Renamed as the gateway renames it
network_plugin = { package = "network", path = "../../plugins/network", default-features = false }
remote = { workspace = true, optional = true }
store = { workspace = true, optional = true }
# Game modules and plugins, compiled in, as their own process (DF3) or as a library (RD27)
module-api.workspace = true
plugin-host.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
service-kit.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
tempfile.workspace = true

[lints]
workspace = true

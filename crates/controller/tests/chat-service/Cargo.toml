# A chat service library for controller's tests (tests/chat_library.rs): every chat message once. A workspace of its
# own, as tests/echo-service is.
[package]
name = "chat-service"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
module-api = { path = "../../../module-api" }
serde_json = "1"
service-kit = { path = "../../../service-kit" }
service-plugin = { path = "../../../service-plugin" }
tokio = { version = "1", features = ["rt", "time"] }

[workspace]

[package]
name = "rustic-isles-chat"
description = "Rustic Isles' chat rules for the chat plugin (JIDs, rooms, the SASL login check, friends), the hub-session registry, the party headline body, the chat home operations and the chat area routes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Clean-room rewrite from docs/port/spec-rustic-isles-chat.md (RD27, docs/port/clean-room/rustic-isles-chat.md)
license = "MIT"
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
http.workspace = true
http-body-util.workspace = true
dainty-module-api.workspace = true
percent-encoding.workspace = true
rustic-isles.workspace = true
rustic-isles-auth.workspace = true
rustic-isles-store.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
dainty-service-kit.workspace = true
tracing.workspace = true
# A UUID read as the ULID with the same bits (spec §4.3)
ulid.workspace = true

[dev-dependencies]
rustic-isles = { workspace = true, features = ["test-support"] }
rustic-isles-auth = { workspace = true, features = ["test-support"] }
rustic-isles-store = { workspace = true, features = ["test-support"] }
dainty-store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower.workspace = true

[lints]
workspace = true

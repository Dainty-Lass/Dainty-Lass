[package]
name = "server-gui-reforged"
description = "Tauri desktop server-GUI binary for the Reforged edition only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reforged-only-server-gui"
path = "src/main.rs"

[dependencies]
launcher = { workspace = true, default-features = false, features = ["edition-reforged", "server-gui"] }
protocol = { workspace = true, default-features = false, features = ["edition-reforged"] }

[lints]
workspace = true

[package]
name = "server-console"
description = "Interactive REPL and ratatui TUI server binary supporting both Refined and Reforged editions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reforged-server-console"
path = "src/main.rs"

[dependencies]
host = { workspace = true, default-features = false, features = ["edition-both"] }
protocol = { workspace = true, default-features = false, features = ["edition-both"] }

[lints]
workspace = true

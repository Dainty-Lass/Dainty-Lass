[package]
name = "online-client"
description = "Pure online player client binary supporting both Refined and Reforged editions (zero server crates linked)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reforged-client"
path = "src/main.rs"

[dependencies]
launcher = { workspace = true, default-features = false, features = ["edition-both"] }
protocol = { workspace = true, default-features = false, features = ["edition-both"] }

[lints]
workspace = true

# cargo-deny, on DaintyLass's rules (rust/deny.toml there): licences that can ship in an AGPL-3.0-only release,
# known advisories, and only crates.io, the silentspud registry and, until it serves them, DaintyLass's repository.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "PostgreSQL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # rustls with aws-lc-rs everywhere, as in DaintyLass (D10); no OpenSSL.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://git.silentspud.com/api/packages/silentspud/cargo/",
]
# DF1's fallback until the registry serves module-api and store
allow-git = [
    "ssh://git@git.silentspud.com:222/silentspud/dainty-lass.git",
]

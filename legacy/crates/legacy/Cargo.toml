[package]
name = "legacy"
description = "The DaintyLass plugin \"legacy\": imports old installs (Dauntless Revived 1.4.4, Reforged Node kits) into 1.14.7"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The plugin as an executable the controller starts out of process (DD5); run with arguments, the same imports from
# the command line, for a host kit that upgrades an old install before DaintyLass first starts
[[bin]]
name = "dainty-legacy"
path = "src/main.rs"
test = false
doc = false

[dependencies]
legacy-import.workspace = true
module-api.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
legacy-import = { workspace = true, features = ["test-support"] }
diesel.workspace = true
store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

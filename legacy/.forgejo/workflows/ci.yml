# The workspace on Forgejo Actions (DX3): fmt, clippy, tests and cargo-deny on Linux, and a short run of each fuzz
# target. Runner label docker (dainty-lass docs/ci-runners.md). Actions are pinned by commit.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust workspace
    runs-on: docker
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cargo fetches module-api and store over git (git-fetch-with-cli); rewrite the SSH remote to HTTPS in CI (DD2)
      - name: Fetch git dependencies over HTTPS
        env:
          READ_TOKEN: ${{ secrets.CI_READ_TOKEN || github.token }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://token:${READ_TOKEN}@git.silentspud.com/".insteadOf "ssh://git@git.silentspud.com:222/"
          else
            git config --global url."https://git.silentspud.com/".insteadOf "ssh://git@git.silentspud.com:222/"
          fi

      # The docker label's image has Node for the actions but no Rust
      - name: Install rustup
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check

  fuzz:
    name: Fuzz (short)
    runs-on: docker
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch git dependencies over HTTPS
        env:
          READ_TOKEN: ${{ secrets.CI_READ_TOKEN || github.token }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://token:${READ_TOKEN}@git.silentspud.com/".insteadOf "ssh://git@git.silentspud.com:222/"
          else
            git config --global url."https://git.silentspud.com/".insteadOf "ssh://git@git.silentspud.com:222/"
          fi

      - name: Install rustup, nightly and cargo-fuzz
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2

      - name: Run each target for a minute
        run: |
          for target in database_readers host_json; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done
